  - condition: tool.nozzle_diameter == 0.4
    id: HSV/IEQ/R5uNzS6Su/wYyA
    values:
      max_layer_height: 0.30
      min_layer_height: 0.07
      nozzle_diameter: 0.4
      retract_lift: 0.4
      retract_before_travel: 1.5
# 0.6    
  - condition: tool.nozzle_diameter == 0.6
    id: nEJtdTGGTnGArE090KlioQ
    values:
      max_layer_height: 0.40
      min_layer_height: 0.15
      nozzle_diameter: 0.6
      retract_length: 0.8
      retract_lift: 0.4
      deretract_speed: 25

# 0.8    
  - condition: tool.nozzle_diameter == 0.8
    id: R9JvIsF8Sj66DMKqjpn6Vg
    values:
      deretract_speed: 20
      max_layer_height: 0.6
      min_layer_height: 0.2
      nozzle_diameter: 0.8
      retract_length: 0.7
      retract_lift: 0.25
