kind: tool_print
id: '*common MK2*'
variants:
- condition: printer.model == "MK2S" and feeder.base_model != "MMU1"
  id: K+7bXZvmTA+7skvu2+pMIg
  values:
    retract_layer_change: true
    retract_length_toolchange: 0
    retract_lift_above: 0
    retract_lift_below: 199
    retract_restart_extra: 0
    retract_restart_extra_toolchange: 0
    travel_ramping_lift: 0
    travel_slope: 1
    travel_max_lift: 1.5
    wipe: 1
    retract_speed: 35
    deretract_speed: 0
    retract_length: 0.8
  variants:
# 0.25    
  - condition: tool.nozzle_diameter == 0.25
    id: WMGOk7rUR7qne5kGTijxhw
    values:
      max_layer_height: 0.15
      min_layer_height: 0.05
      nozzle_diameter: 0.25
      retract_lift: 0.15
# 0.4    
  - condition: tool.nozzle_diameter == 0.4
    id: 7QQErEQqTx+dJxlT2UDdyA
    values:
      max_layer_height: 0.30
      min_layer_height: 0.07
      nozzle_diameter: 0.4
      retract_lift: 0.4
      retract_before_travel: 1.5
# 0.6    
  - condition: tool.nozzle_diameter == 0.6
    id: dzPSXAvPTgSQBO079HzGMg
    values:
      max_layer_height: 0.40
      min_layer_height: 0.15
      nozzle_diameter: 0.6
      retract_length: 0.8
      retract_lift: 0.4
      deretract_speed: 25
- condition: printer.model == "MK2S" and feeder.base_model == "MMU1"
  id: TCOgTmlORjCdaTOMkXgm7g
  values:
    retract_layer_change: false
    retract_length_toolchange: 4
    retract_lift_above: 0
    retract_lift_below: 199
    retract_restart_extra: 0
    retract_restart_extra_toolchange: 0
    retract_lift: 0.6
    wipe: 1
    retract_speed: 80
    deretract_speed: 50
    retract_length: 4
    retract_before_travel: 3
    retract_before_wipe: 60%
  variants:
# 0.25    
  - condition: tool.nozzle_diameter == 0.25
    id: GShE0ZNNSCCkbQ6VYN5sOQ
    values:
      max_layer_height: 0.15
      min_layer_height: 0.05
      nozzle_diameter: 0.25
      retract_lift: 0.4
# 0.4    
  - condition: tool.nozzle_diameter == 0.4
    id: F//K0A49QReT1DOy7UJpzg
    values:
      max_layer_height: 0.30
      min_layer_height: 0.07
      nozzle_diameter: 0.4
# 0.6    
  - condition: tool.nozzle_diameter == 0.6
    id: o+x0QC3vRSyVN2A3ztAfew
    values:
      max_layer_height: 0.40
      min_layer_height: 0.15
      nozzle_diameter: 0.6
