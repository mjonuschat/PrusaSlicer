kind: filament
id: Forward AM Ultrafuse PA6 GF30
inherits:
- '*PACF*'
- '*sheets_PACF_pa6gf30*'
- '*pa6gf30_MAXVOLSPEED_PACF*'
name: Forward AM Ultrafuse PA6 GF30
# No MINI and 0.6+
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.6 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Forward AM
  first_layer_temperature: 270
  temperature: 270
  extrusion_multiplier: 1
  filament_density: 1.17
  filament_spool_weight: 0
  bridge_fan_speed: 100
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 10
  max_fan_speed: 50
  fan_always_on: false
  fan_below_layer_time: 30
  slowdown_below_layer_time: 15
variants:
- condition: printer.base_model == "COREONE"
  id: 20be5772-6c4c-4730-9490-0c819c024c60
  values:
    bridge_fan_speed: 70
    max_fan_speed: 35
    filament_shrinkage_compensation_xy: 0%
    filament_shrinkage_compensation_z: 0.24%
- condition: printer.model == "MK4S"
  id: cb4e6dc7-3e85-49c7-b2d6-844db43e0501
  values:
    bridge_fan_speed: 70
    max_fan_speed: 35
- condition: printer.base_model=~/(MK2|MK3|MK3.5)/
  id: 4e8a9158-4800-4df2-9638-d4bd5fe7cba1
  values:
    retract_speed: 40
    deretract_speed: 30
    retract_length: 1.2
    retract_on_layer_change: false
    retract_wipe: false
---
kind: filament
id: '*sheets_PACF_pa6gf30*'
variants:
# STANDARD sheet
- condition: sheet.type != "PA"
  id: 66b443d5-72db-45b9-bbc7-5d1579b84325
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
# PA sheet
- condition: sheet.type == "PA"
  id: a16dc575-c7ed-422c-80fb-d260b600aadf
  values:
    first_layer_bed_temperature: 90
    bed_temperature: 100
---
