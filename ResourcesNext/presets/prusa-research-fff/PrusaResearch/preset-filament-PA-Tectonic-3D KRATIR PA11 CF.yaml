kind: filament
id: Tectonic-3D KRATIR PA11 CF
inherits:
- '*PACF*'
- '*sheets_PACF_kratirpacf*'
- '*kratirpacf_MAXVOLSPEED_PACF*'
name: Tectonic-3D KRATIR PA11 CF
# No MINI
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Tectonic-3D
  first_layer_temperature: 280
  temperature: 280
  extrusion_multiplier: 1
  filament_density: 1.13
  filament_spool_weight: 200
  bridge_fan_speed: 20
  fan_below_layer_time: 15
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: 497bbb34-4235-4128-835c-802a0c57e13a
  values:
    bridge_fan_speed: 14
    chamber_temperature: 0
    minimal_chamber_temperature: 0
---
kind: filament
id: '*sheets_PACF_kratirpacf*'
variants:
# STANDARD sheet
- condition: sheet.type != "PA"
  id: cb1c6238-8be7-46ea-954b-9371657e70ea
  values:
    first_layer_bed_temperature: 110
    bed_temperature: 110
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
# PA sheet
- condition: sheet.type == "PA"
  id: 688661d5-4dd5-426c-b3df-cc4f1ddfef7c
  values:
    first_layer_bed_temperature: 90
    bed_temperature: 110
---
