kind: filament
id: Taulman T-Glase
inherits:
- '*PET*'
- '*sheets_PET_common*'
- '*TGLASE_P_ADVANCE_PET*'
- '*TGLASE_MAXVOLSPEED_PET*'   
name: Taulman T-Glase
values:
  bridge_fan_speed: 40
  min_fan_speed: 0
  max_fan_speed: 10
  cooling: false
  fan_always_on: false
  slowdown_below_layer_time: 15
  filament_cost: 40
  first_layer_temperature: 240
  temperature: 240
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    chamber_minimal_temperature: 0
    chamber_temperature: 0
    min_fan_speed: 10
    enable_dynamic_fan_speeds: false
    max_fan_speed: 10
    min_print_speed: 15
    bridge_fan_speed: 25
    overhang_fan_speed_0: 0
    overhang_fan_speed_1: 0
    fan_below_layer_time: 20
    filament_infill_max_speed: 200
    filament_load_time: 10.9
    filament_unload_time: 8.9
    start_filament_gcode: M142 S40 ; set heatbreak target temp
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 5
      filament_infill_max_crossing_speed: 100
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      slowdown_below_layer_time: 6
      filament_infill_max_crossing_speed: 100
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 9
      filament_infill_max_crossing_speed: 110
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      slowdown_below_layer_time: 10
      filament_infill_max_crossing_speed: 110
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_infill_max_crossing_speed: 120
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      slowdown_below_layer_time: 15
      fan_below_layer_time: 30
      filament_infill_max_crossing_speed: 140
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      slowdown_below_layer_time: 20
      fan_below_layer_time: 35
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
## XL
- condition: printer.base_model == "XL"
  values:
    idle_temperature: 70
    start_filament_gcode: M142 S40 ; set heatbreak target temp
  variants:
  # XL 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 7
  # XL 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      slowdown_below_layer_time: 9
      filament_infill_max_crossing_speed: 100
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 9
      filament_infill_max_crossing_speed: 110
    variants:
    # XL HF0.4
    - condition: tool.nozzle_high_flow
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      slowdown_below_layer_time: 14
      filament_infill_max_crossing_speed: 110
    variants:
    # XL HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_infill_max_crossing_speed: 120
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      slowdown_below_layer_time: 15
      filament_infill_max_crossing_speed: 140
    variants:
    # XL HF0.6
    - condition: tool.nozzle_high_flow
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      slowdown_below_layer_time: 18
    variants:
    # XL HF0.8
    - condition: tool.nozzle_high_flow
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  values:
    idle_temperature: 130
    start_filament_gcode: M142 S40 ; set heatbreak target temp
  variants:
  # MK4 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 7
      filament_infill_max_crossing_speed: 100
  # MK4 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      slowdown_below_layer_time: 8
      filament_infill_max_crossing_speed: 100
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 9
      filament_infill_max_crossing_speed: 110
    variants:
    # MK4 HF0.4
    - condition: tool.nozzle_high_flow
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      slowdown_below_layer_time: 9
      filament_infill_max_crossing_speed: 110
    variants:
    # MK4 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_infill_max_crossing_speed: 120
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      slowdown_below_layer_time: 14
      fan_below_layer_time: 20
      filament_infill_max_crossing_speed: 140
    variants:
    # MK4 HF0.6
    - condition: tool.nozzle_high_flow
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      slowdown_below_layer_time: 18
      fan_below_layer_time: 22
    variants:
    # MK4 HF0.8
    - condition: tool.nozzle_high_flow
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  values:
    idle_temperature: 70
    start_filament_gcode: M142 S40 ; set heatbreak target temp
  variants:
  # MK4S 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 6
  # MK4S 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      slowdown_below_layer_time: 6
      filament_infill_max_crossing_speed: 100
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 7
      filament_infill_max_crossing_speed: 110
    variants:
    # MK4S HF0.4
    - condition: tool.nozzle_high_flow
  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      slowdown_below_layer_time: 8
      filament_infill_max_crossing_speed: 110
    variants:
    # MK4S HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_infill_max_crossing_speed: 120
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      slowdown_below_layer_time: 10
      fan_below_layer_time: 22
      filament_infill_max_crossing_speed: 140
    variants:
    # MK4S HF0.6
    - condition: tool.nozzle_high_flow
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      slowdown_below_layer_time: 18
      fan_below_layer_time: 25
    variants:
    # MK4S HF0.8
    - condition: tool.nozzle_high_flow
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  # MK3.5 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 10
    variants:
    # MK3.5 0.25 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 2
  # MK3.5 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      slowdown_below_layer_time: 12
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 15
    variants:
    # MK3.5 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 7
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      slowdown_below_layer_time: 16
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      slowdown_below_layer_time: 17
      max_fan_speed: 60
    variants:
    # MK3.5 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 13
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      slowdown_below_layer_time: 20
      max_fan_speed: 60
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # MINI 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 10
  # MINI 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 10
  # MINI 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      slowdown_below_layer_time: 17
  # MINI 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      slowdown_below_layer_time: 20
## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model=~/(MK3|MK2.5)/
  variants:
  # MK3 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 10
    variants:
    # MK3 0.25 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 2
  # MK3 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 12
    variants:
    # MK3 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
  # MK3 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      slowdown_below_layer_time: 17
    variants:
    # MK3 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 13
  # MK3 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      slowdown_below_layer_time: 20
## MK2S
- condition: printer.model == "MK2S"
  variants:
  # MK2 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 15
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 15
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 17
## MK2S MMU1
- condition: printer.model == "MK2SMM"
  variants:
  # MK2 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 15
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 15
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 20
---        
kind: filament
# Pressure advance values for COREONE/MK4/XL family
id: '*TGLASE_P_ADVANCE_PET*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.14
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.09
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.05
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.05
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.035
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.035
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.025
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.025
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.016
