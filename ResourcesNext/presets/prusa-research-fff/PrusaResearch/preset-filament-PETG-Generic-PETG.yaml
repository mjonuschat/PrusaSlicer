kind: filament
id: Generic PETG
inherits:
- '*PET*'
name: Generic PETG
values:
  filament_cost: '19.99'
  filament_vendor: Generic
## C1
variants:
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 22
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 14
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 25
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 16
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 29
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 20
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 35
