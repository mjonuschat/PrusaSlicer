kind: filament
id: Polymaker PolyTerra PLA
inherits:
- '*PLA*'
- '*PolyTerraPLA_P_ADVANCE*' 
- '*PolyTerraPLA_MAXVOLSPEED*' 
name: Polymaker PolyTerra PLA
values:
  filament_vendor: Polymaker
  filament_cost: 25
  filament_density: 1.31
  filament_spool_weight: 140
---        
kind: filament
# Pressure advance values
id: '*PolyTerraPLA_P_ADVANCE*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.08
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.054
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.024
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.024
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.016
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.016
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.017
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.017
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.01
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.57
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.22
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.11
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.08
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.08
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.054
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.024
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.017
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.015
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
## MK3
- condition: printer.base_model=~/(MK3|MK2.5)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.05
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.035
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.028
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.007
## MK2
- condition: printer.base_model == "MK2"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 22
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 22
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 13
## MK2 MMU1 
- condition: printer.base_model == "MK2MMU1"
  values:
    pressure_advance_value: 200
---        
kind: filament
# Maximum volumetric speed limits
id: '*PolyTerraPLA_MAXVOLSPEED*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 17
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 17
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
