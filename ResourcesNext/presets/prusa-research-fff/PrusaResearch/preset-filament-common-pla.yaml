kind: filament
id: '*PLA*'
inherits:
- '*common*'
- '*sheets_PLA_common*'
features:
  $.type: PLA
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and feeder.model!~/(MMU2S|MMU3_8bit)/
values:
