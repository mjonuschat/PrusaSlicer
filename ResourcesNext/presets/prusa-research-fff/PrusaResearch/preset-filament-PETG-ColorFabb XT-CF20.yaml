kind: filament
id: ColorFabb XT-CF20
inherits:
- '*PETCF*'
- '*XTCF20_MAXVOLSPEED*'
name: ColorFabb XT-CF20
values:
  filament_vendor: ColorFabb
  extrusion_multiplier: 1.05
  filament_cost: 80.65
  filament_density: 1.35
  filament_spool_weight: 236
  temperature: 260
---        
kind: filament
# Maximum volumetric speed limits
id: '*XTCF20_MAXVOLSPEED*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 3
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 4
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 6
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 6
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 9
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 9
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 2
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 2
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 6
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 9
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3
    variants:
    # MK3.5 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 3
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 6
    variants:
    # MK3.5 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 6
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 9
## MK3
- condition: printer.base_model=~/(MK3|MK2.5)/
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 2
    variants:
    # MK3 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 2
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 6
    variants:
    # MK3 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 6
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 9
## MK2
- condition: printer.base_model == "MK2"
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 2
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5
## MK2 MMU1 
- condition: printer.base_model == "MK2MMU1"
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 2
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 4