kind: filament
id: Filament PM FRJet
inherits:
- '*PET*'
- '*FRJet_MAXVOLSPEED*'
name: Filament PM FRJet
values:
  filament_vendor: Filament PM
  extrusion_multiplier: 0.95
  first_layer_temperature: 240
  temperature: 240
  bridge_fan_speed: 15
  min_fan_speed: 10
  max_fan_speed: 15
  cooling: false
  fan_always_on: false
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: 31f5415d-de60-4872-babc-12f175586c0a
  values:
    bridge_fan_speed: 12
    enable_dynamic_fan_speeds: true
    overhang_fan_speed_0: 12
