kind: filament
id: '*PLAFILL*'
inherits:
- '*PLA*'
- '*sheets_PLA_common*'
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  first_layer_temperature: 200
  temperature: 200
  filament_max_volumetric_speed: 7
  pressure_advance_enable: true
  cooling_slowdown_logic: consistent_surface
  cooling_perimeter_transition_distance: 10
variants:
  ## C1
- condition: printer.base_model == "COREONE"
  id: 608dc33a-87aa-4f24-af9b-8f909e6d645c
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 02d7658d-7528-4305-aabb-fd224c632237
    name: '*PLAFILL* @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 8
      pressure_advance_value: 0.03
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      id: ff0f0e84-dae2-4559-bd08-43c79afb75be
      name: '*PLAFILL* @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 8
        pressure_advance_value: 0.03
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: c7ede286-e025-429c-a68b-5c4decd8518f
    name: '*PLAFILL* @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 9
      pressure_advance_value: 0.022
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      id: aa953d94-b458-4b2f-87c8-dd4a8d376321
      name: '*PLAFILL* @COREONE HF0.5'
      values:
        filament_max_volumetric_speed: 9
        pressure_advance_value: 0.022
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 819e699c-ed6e-4a76-ba93-031c501576f8
    name: '*PLAFILL* @COREONE 0.6'
    values:
      filament_max_volumetric_speed: 12
      pressure_advance_value: 0.018
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      id: c5cde4ab-0398-48d1-83bc-ad3688c1ba76
      name: '*PLAFILL* @COREONE HF0.6'
      values:
        filament_max_volumetric_speed: 12
        pressure_advance_value: 0.018
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 89887ef1-265a-4ebb-b275-06d61bc8f229
    name: '*PLAFILL* @COREONE 0.8'
    values:
      filament_max_volumetric_speed: 12
      pressure_advance_value: 0.012
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      id: 7e38f6fc-ca59-4022-aaab-8bcdfc420049
