kind: filament
id: Elegoo PLA
inherits:
- '*PLA*'
name: Elegoo PLA
values:
  filament_cost: '22'
  filament_vendor: Elegoo
  filament_density: 1.26
  filament_spool_weight: 160
variants:
  ## C1
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.072
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.045
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.02
      slowdown_below_layer_time: 6
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        slowdown_below_layer_time: 6
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.016
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.014
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
## XL
- condition: printer.base_model == "XL"
  variants:
  # XL 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.072
  # XL 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.045
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.02
      slowdown_below_layer_time: 7
    variants:
    # XL HF0.4
    - condition: tool.nozzle_high_flow
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.016
    variants:
    # XL HF0.5
    - condition: tool.nozzle_high_flow
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.014
    variants:
    # XL HF0.6
    - condition: tool.nozzle_high_flow
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
    variants:
    # XL HF0.8
    - condition: tool.nozzle_high_flow
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  variants:
  # MK4 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.072
  # MK4 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.045
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.02
      slowdown_below_layer_time: 6
    variants:
    # MK4 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.02
        slowdown_below_layer_time: 6
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.016
    variants:
    # MK4 HF0.5
    - condition: tool.nozzle_high_flow
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.014
    variants:
    # MK4 HF0.6
    - condition: tool.nozzle_high_flow
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
    variants:
    # MK4 HF0.8
    - condition: tool.nozzle_high_flow
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  variants:
  # MK4S 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.072
  # MK4S 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.045
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.02
      slowdown_below_layer_time: 4
    variants:
    # MK4S HF0.4
    - condition: tool.nozzle_high_flow
      slowdown_below_layer_time: 4

  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.016
    variants:
    # MK4S HF0.5
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.016
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.014
    variants:
    # MK4S HF0.6
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.014
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.01
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  # MK3.5 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.08
    variants:
    # MK3.5 0.25 MMU
    - condition: feeder.base_model == "MMU"
  # MK3.5 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.055
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.025
    variants:
    # MK3.5 0.4 MMU
    - condition: feeder.base_model == "MMU"
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.017
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.015
    variants:
    # MK3.5 0.6 MMU
    - condition: feeder.base_model == "MMU"
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # MINI 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.59
  # MINI 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.19
  # MINI 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.12
  # MINI 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.08
## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model=~/(MK3|MK2.5)/
  variants:
  # MK3 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.04
    variants:
    # MK3 0.25 MMU
    - condition: feeder.base_model == "MMU"
  # MK3 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.04
    variants:
    # MK3 0.4 MMU
    - condition: feeder.base_model == "MMU"
  # MK3 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.03
    variants:
    # MK3 0.6 MMU
    - condition: feeder.base_model == "MMU"
  # MK3 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.007
## MK2S
- condition: printer.model == "MK2S"
  variants:
  # MK2 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 22
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 22
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 13