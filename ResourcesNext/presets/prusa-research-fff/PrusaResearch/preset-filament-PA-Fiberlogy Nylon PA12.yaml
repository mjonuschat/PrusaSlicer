kind: filament
id: Fiberlogy Nylon PA12
inherits:
- '*PA*'
- '*FiberlogyPA12_MAXVOLSPEED_PA*'
- '*sheets_PA_FiberlogyPA12*'
name: Fiberlogy Nylon PA12
values:
  filament_vendor: Fiberlogy
  first_layer_temperature: 265
  temperature: 265
  filament_cost: 48
  filament_density: 1.01
  filament_spool_weight: 330
  bridge_fan_speed: 30
  disable_fan_first_layers: 5
  min_fan_speed: 10
  max_fan_speed: 15
  fan_below_layer_time: 20
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: c06a2c4a-96f7-41bc-abaf-e23ff40327c1
  values:
    bridge_fan_speed: 20
    max_fan_speed: 12
