kind: filament
id: '*PLASILK*'
inherits:
- '*common*'
- '*PLA*'
- '*sheets_PLA_common*'
values:
  first_layer_temperature: 220
  temperature: 220
  filament_max_volumetric_speed: 7
  pressure_advance_enable: true
  cooling_slowdown_logic: consistent_surface
  cooling_perimeter_transition_distance: 10
variants:
  ## C1
- condition: printer.base_model == "COREONE"
  values:
    first_layer_temperature: 230
    temperature: 225
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    name: '*PLASILK* @COREONE 0.25'
    values:
      filament_max_volumetric_speed: 7.5
      slowdown_below_layer_time: 6
      pressure_advance_value: 0.12
      temperature: 220
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    name: '*PLASILK* @COREONE 0.3'
    values:
      filament_max_volumetric_speed: 7.5
      slowdown_below_layer_time: 8
      pressure_advance_value: 0.075
      temperature: 220
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: '*PLASILK* @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 7.5
      slowdown_below_layer_time: 8
      pressure_advance_value: 0.03
      temperature: 225
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: '*PLASILK* @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 7.5
        pressure_advance_value: 0.03
        temperature: 225
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: '*PLASILK* @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 8
      slowdown_below_layer_time: 10
      pressure_advance_value: 0.022
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      name: '*PLASILK* @COREONE HF0.5'
      values:
        filament_max_volumetric_speed: 8
        pressure_advance_value: 0.022
        temperature: 225
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: '*PLASILK* @COREONE 0.6'
    values:
      filament_max_volumetric_speed: 9
      pressure_advance_value: 0.018
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      name: '*PLASILK* @COREONE HF0.6'
      values:
        filament_max_volumetric_speed: 10
        pressure_advance_value: 0.018
        temperature: 225
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    name: '*PLASILK* @COREONE 0.8'
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 17
      pressure_advance_value: 0.012
      temperature: 230
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      name: '*PLASILK* @COREONE HF0.8'
      values:
        filament_max_volumetric_speed: 12
        pressure_advance_value: 0.012
