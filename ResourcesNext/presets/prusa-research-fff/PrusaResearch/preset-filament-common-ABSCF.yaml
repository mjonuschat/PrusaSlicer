## MK3.5
- condition: printer.base_model == "MK3.5"
  values:
    filament_ramming_parameters: 120 110 5.32258 5.45161 5.67742 6 6.48387 7.12903 7.90323 8.70968 9.3871 9.83871 10.0968 10.2258| 0.05 5.30967 0.45 5.50967 0.95 6.1871 1.45 7.39677 1.95 9.05484 2.45 10 2.95 10.3098 3.45 13.0839 3.95 7.6 4.45 7.6 4.95 7.6
    filament_load_time: 15
    filament_loading_speed: 14
    filament_loading_speed_start: 19
    filament_cooling_final_speed: 1
    filament_cooling_initial_speed: 2
    filament_cooling_moves: 1
    filament_stamping_distance: 0
    filament_stamping_loading_speed: 20
    filament_toolchange_delay: 0
    filament_unload_time: 12
    filament_unloading_speed: 20
    filament_unloading_speed_start: 120
    idle_temperature:
    filament_purge_multiplier: 100%
    filament_max_volumetric_speed: 8
    retract_lift: 0.2
    travel_max_lift: 1.5
    travel_ramping_lift: 0
    travel_slope: 1
    cooling_slowdown_logic: uniform_cooling
  variants:
  # MK3.5 0.25
  - condition: tool.nozzle_diameter == 0.25
    name: '*ABSCF* @MK3.5 0.25'
    values:
      slowdown_below_layer_time: 20
      pressure_advance_value: 0.09
    variants:
    # MK3.5 0.25 MMU
    - condition: feeder.base_model == "MMU"
      name: '*ABSCF* @MK3.5 0.25 MMU'
      values:
        filament_max_volumetric_speed: 2
        filament_ramming_parameters: 200 110 3.41935 3.6129 3.93548 4.35484 4.87097 5.51613 6.25806 7.06452 7.80645 8.35484 8.70968 8.83871| 0.05 3.37419 0.45 3.70322 0.95 4.5742 1.45 5.78387 1.95 7.44194 2.45 8.58065 2.95 8.89045 3.45 13.0839 3.95 7.6 4.45 7.6 4.95 7.6
  # MK3.5 0.3
  - condition: tool.nozzle_diameter == 0.3
    name: '*ABSCF* @MK3.5 0.3'
    values:
      slowdown_below_layer_time: 20
      pressure_advance_value: 0.065
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: '*ABSCF* @MK3.5 0.4'
    values:
      slowdown_below_layer_time: 20
      filament_max_volumetric_speed: 11
      pressure_advance_value: 0.02
      filament_infill_max_crossing_speed: 0
    variants:
    # MK3.5 0.4 MMU
    - condition: feeder.base_model == "MMU"
      name: '*ABSCF* @MK3.5 0.4 MMU'
      values:
        filament_max_volumetric_speed: 11
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: '*ABSCF* @MK3.5 0.5'
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 20
      pressure_advance_value: 0.018
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: '*ABSCF* @MK3.5 0.6'
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 20
      pressure_advance_value: 0.012
    variants:
    # MK3.5 0.6 MMU
    - condition: feeder.base_model == "MMU"
      name: '*ABSCF* @MK3.5 0.6 MMU'
      values:
        temperature: 260
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    name: '*ABSCF* @MK3.5 0.8'
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 25
      pressure_advance_value: 0.01
## MINI
- condition: printer.base_model == "MINI"
