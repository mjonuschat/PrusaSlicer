kind: filament
id: '*ABSCF*'
inherits:
- '*ABS*'
- '*common*'
values:
  filament_abrasive: true
condition: 'printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/'
## C1
variants:
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: '*ABSCF* @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 13
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: '*ABSCF* @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 13
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: '*ABSCF* @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 15
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      name: '*ABSCF* @COREONE HF0.5'
      values:
        filament_max_volumetric_speed: 15
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: '*ABSCF* @COREONE 0.6'
    values:
      filament_max_volumetric_speed: 15
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      name: '*ABSCF* @COREONE HF0.6'
      values:
        filament_max_volumetric_speed: 15
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    name: '*ABSCF* @COREONE 0.8'
    values:
      filament_max_volumetric_speed: 18
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      name: '*ABSCF* @COREONE HF0.8'
      values:
        filament_max_volumetric_speed: 18
