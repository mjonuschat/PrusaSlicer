kind: filament
id: Print With Smile TPU96A
inherits:
- '*FLEX*'
name: Print With Smile TPU96A
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: Print With Smile
  first_layer_temperature: 240
  temperature: 240
  min_fan_speed: 60
  extrusion_multiplier: 1.1
  filament_cost: 1200
  filament_density: 1.31
  retract_length: 2
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 9763f4de-b4c4-43c2-aa4b-4c66c58fa261
  values:
    bridge_fan_speed: 60
    min_fan_speed: 45
    max_fan_speed: 45
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 2f3731bd-b204-4386-80e8-8c7057e4b74d
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: c72bb613-aa6e-41ed-9ba3-c65c368b67f5
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: ae8dee9c-227c-405d-ac0a-3fae4f18c365
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: e6415f95-b1e6-43c3-ae56-4172d54f6655
    values:
      filament_max_volumetric_speed: 7
## XL
- condition: printer.base_model == "XL"
  id: da475413-cbc0-4e32-9570-0f7a0c309004
  values:
    retract_length_toolchange: 2
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 4190b1d9-f3ed-45e7-9845-b240072891c3
    values:
      filament_max_volumetric_speed: 2.5
      filament_multitool_ramming_flow: 2.5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 0ec8e335-a93c-4dfa-a406-ad9ac63672e7
    values:
      filament_max_volumetric_speed: 2.5
      filament_multitool_ramming_flow: 2.5
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 57229608-001d-4fab-8b96-5d19d0c106f4
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 92656f64-2044-44a5-ab70-5f16b6144331
    values:
      filament_max_volumetric_speed: 7
      filament_multitool_ramming_flow: 7
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: 5eaa4de3-9f61-400a-b36b-e1cf3612a090
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: ea9be214-e7a8-4c5c-9147-35bc367dfd19
    values:
      filament_max_volumetric_speed: 3
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 61a5bdbb-ec3f-4393-90cc-59e60749f736
    values:
      filament_max_volumetric_speed: 3
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: c9f3d146-2807-4ef7-bc7d-d8e856ee2ce6
    values:
      filament_max_volumetric_speed: 5
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 27c60911-29fe-4ba4-ac39-8e4ce2bf917a
    values:
      filament_max_volumetric_speed: 8
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: 2925fa4a-5592-4762-881f-1beb8fdc293b
  values:
    bridge_fan_speed: 60
    min_fan_speed: 20
    max_fan_speed: 60
  variants:
