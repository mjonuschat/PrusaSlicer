kind: filament
id: ColorFabb nGen flex
inherits:
- '*FLEX*'
name: ColorFabb nGen flex
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: ColorFabb
  filament_cost: 58.3
  min_fan_speed: 20
  max_fan_speed: 35
  bridge_fan_speed: 40
  fan_always_on: false
  fan_below_layer_time: 10
  slowdown_below_layer_time: 15
  extrusion_multiplier: 1
  filament_density: 1
  first_layer_temperature: 260
  temperature: 260
  first_layer_bed_temperature: 85
  bed_temperature: 85
  retract_length: 2.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: df514aa6-7600-44f7-990e-bd7a800f44de
  values:
    bridge_fan_speed: 30
    min_fan_speed: 20
    max_fan_speed: 20
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 9154047f-1a7f-4aa3-a39f-356f79335597
    values:
      filament_max_volumetric_speed: 5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: e44893cc-c196-4075-a16e-bccc5c50428b
    values:
      filament_max_volumetric_speed: 5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 88e8342d-bc98-4a35-958e-210faa1df31f
    values:
      filament_max_volumetric_speed: 6
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 9989275b-d467-4645-b806-fd256df330ec
    values:
      filament_max_volumetric_speed: 9
## XL
- condition: printer.base_model == "XL"
  id: 76a3043e-9b1f-469f-b65b-19b13d20334f
