kind: filament
id: Filatech FilaFlexible30
inherits:
- '*FLEX*'
name: Filatech FilaFlexible30
values:
  temperature: 225
  first_layer_temperature: 230
  filament_cost: 0
  filament_density: 1.15
  extrusion_multiplier: 1.1
  filament_spool_weight: 0
  filament_max_volumetric_speed: 3.5
  retract_length: 3
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    chamber_minimal_temperature: 0
    chamber_temperature: 30
    bridge_fan_speed: 70
    max_fan_speed: 40
    min_fan_speed: 35
    idle_temperature: 150
    cooling: 1
    slowdown_below_layer_time: 10
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3.5
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 3.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 4
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 8
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  values:
    filament_multitool_ramming_flow: 3.5
    filament_multitool_ramming_volume: 40
    retract_length_toolchange: 3
    idle_temperature: 70
    filament_minimal_purge_on_wipe_tower: 35
    travel_ramping_lift: 1
    travel_max_lift: 1.5
    travel_slope: 1
    retract_length: 3
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3.5
    variants:
    # XL HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 3.5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
    variants:
    # XL HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 4
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5
      filament_multitool_ramming_flow: 5
    variants:
    # XL HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
    variants:
    # XL HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 8
## MK4
- condition: printer.model == "MK4"
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3.5
    variants:
    # MK4 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 3.5
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
    variants:
    # MK4 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 4
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 7
    variants:
    # MK4 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 7
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
    variants:
    # MK4 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 10
## MK4S
- condition: printer.model == "MK4S"
  values:
    bridge_fan_speed: 70
    max_fan_speed: 50
  variants:
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3.5
    variants:
    # MK4S HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 3.5
  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
    variants:
    # MK4S HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 4
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 7
    variants:
    # MK4S HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 7
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
    variants:
    # MK4S HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 10
## MK3.5
- condition: printer.base_model == "MK3.5"
  values:
    extrusion_multiplier: 1.15
    first_layer_temperature: 230
    temperature: 225
    idle_temperature: 70
    # TODO: there is key collision for filament_retract_speed
    #retract_speed: 50
    retract_speed:
    deretract_speed: 25
    retract_length: 2
    retract_before_travel: 3
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 2.5
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 2.5
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 2.5
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 2.5
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 4
