## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model == "MK3"
  values:
    extrusion_multiplier: 1.15
    first_layer_temperature: 230
    temperature: 225
    idle_temperature: 70
    cooling: 0
    fan_always_on: 0
    min_fan_speed: 50
    max_fan_speed: 50
    slowdown_below_layer_time: 10
    retract_speed: 50
    deretract_speed: 25
    retract_length: 2
    retract_lift: 0
    travel_ramping_lift: 0
  variants:
  # MK3 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 2.5
  # MK3 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 2.5
  # MK3 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 3.5
## MK2S
- condition: printer.model == "MK2S"
  values:
    extrusion_multiplier: 1.15
    first_layer_temperature: 230
    temperature: 225
    idle_temperature: 70
    cooling: 0
    fan_always_on: 0
    min_fan_speed: 50
    max_fan_speed: 50
    slowdown_below_layer_time: 10
    retract_speed:
    deretract_speed: 20
    retract_length: 2
    retract_lift: 0
    travel_ramping_lift: 0
  variants:
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 2
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 2
