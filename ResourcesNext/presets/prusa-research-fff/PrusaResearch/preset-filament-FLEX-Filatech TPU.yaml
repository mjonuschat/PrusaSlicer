kind: filament
id: Filatech TPU
inherits:
- '*FLEX*'
name: Filatech TPU
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: Filatech
  filament_cost: 84.68
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 80
  max_fan_speed: 80
  fan_below_layer_time: 60
  extrusion_multiplier: 1.1
  filament_density: 1.2
  first_layer_temperature: 235
  temperature: 235
  retract_length: 2.2
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 3eeaf9d7-e491-40eb-890d-d41c872297fd
  values:
    bridge_fan_speed: 70
    min_fan_speed: 30
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: b7175bf7-d082-455f-9d5c-0abfdc7eaf56
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: e1d3f04b-50ec-42c7-8281-24e614c524a6
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 081e63a8-88f8-404a-a4c2-64a3c60094e1
    values:
      filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 55bb8619-0ac5-4a24-8676-942cd70f5841
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  id: 937ff002-141f-4e57-ad69-c63b75e0d270
  values:
    retract_length_toolchange: 2.2
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 79ff67e3-54db-4ab8-b0e2-b2544becfa23
    values:
      filament_max_volumetric_speed: 4.5
      filament_multitool_ramming_flow: 4.5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 76a2d60a-ba82-4d11-803c-d174ceb720aa
    values:
      filament_max_volumetric_speed: 4.5
      filament_multitool_ramming_flow: 4.5
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 6de5a352-5cf0-4384-b0fe-c90e2988fe39
    values:
      filament_max_volumetric_speed: 5
      filament_multitool_ramming_flow: 5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: d063ebb0-5f12-4c53-bfc3-9f2e496d593f
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: 1fe146bb-679b-4b2c-b841-f0698c600095
