kind: filament
id: Elegoo Rapid PETG
inherits:
- '*PET*'
- '*RAPIDPETG_P_ADVANCE*'
name: Elegoo Rapid PETG
values:
  filament_vendor: Elegoo
  filament_cost: 22
  filament_density: 1.29
  filament_spool_weight: 160
  first_layer_temperature: 250
  temperature: 250
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 14
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 14
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 14
      filament_infill_max_crossing_speed: 200
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 25
        filament_infill_max_crossing_speed: 250
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 14
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 28
        filament_infill_max_crossing_speed: 200
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 17
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 32
        filament_infill_max_crossing_speed: 200
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 22
      first_layer_temperature: 255
      temperature: 255
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 39
        first_layer_temperature: 260
        temperature: 260
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 9
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 10
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 15
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 9
    variants:
    # MK3.5 0.25 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 2
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 9
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
    variants:
    # MK3.5 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 7
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 15
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 17
    variants:
    # MK3.5 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 13
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 20
## MK3
- condition: printer.base_model=~/(MK3|MK2.5)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 8
    variants:
    # MK3 0.25 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 2
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
    variants:
    # MK3 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 7
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
    variants:
    # MK3 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        filament_max_volumetric_speed: 13
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 20
## MK2
- condition: printer.base_model == "MK2"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 8
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
## MK2 MMU1 
- condition: printer.base_model == "MK2MMU1"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 8
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
