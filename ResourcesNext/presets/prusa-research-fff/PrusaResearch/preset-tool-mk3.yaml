kind: tool_print
id: '*common MK3*'
variants:
- condition: printer.base_model == "MK3"
  id: c62d13d4-cd8d-42f8-b083-4e4c6cbe5609
  values:
    retract_layer_change: 1
    retract_length_toolchange: 0
    retract_lift_above: 0
    retract_lift_below: 209
    retract_restart_extra: 0
    retract_restart_extra_toolchange: 0
    travel_ramping_lift: 0
    travel_slope: 1
    travel_max_lift: 1.5
    wipe: 1
    retract_speed: 35
    deretract_speed: 0
    retract_length: 0.8
  variants:
# 0.25    
  - condition: tool.nozzle_diameter == 0.25
    id: fcda30ba-1942-4342-a3b1-1c99b99e1a1a
    values:
      max_layer_height: 0.15
      min_layer_height: 0.05
      nozzle_diameter: 0.25
      retract_lift: 0.15
# 0.4    
  - condition: tool.nozzle_diameter == 0.4
    id: 79ea7047-a9d0-431a-abea-d579c50cf0c3
    values:
      max_layer_height: 0.30
      min_layer_height: 0.07
      nozzle_diameter: 0.4
      retract_lift: 0.4
      retract_before_travel: 1.5
# 0.6    
  - condition: tool.nozzle_diameter == 0.6
    id: 23891195-e8f9-4b96-89a7-2a65c1f018d0
    values:
      max_layer_height: 0.40
      min_layer_height: 0.15
      nozzle_diameter: 0.6
      retract_length: 0.8
      retract_lift: 0.4
      deretract_speed: 25

# 0.8    
  - condition: tool.nozzle_diameter == 0.8
    id: 4b88add1-b163-4ebf-a22f-3a8c5224cda8
    values:
      deretract_speed: 20
      max_layer_height: 0.6
      min_layer_height: 0.2
      nozzle_diameter: 0.8
      retract_length: 0.7
      retract_lift: 0.25
