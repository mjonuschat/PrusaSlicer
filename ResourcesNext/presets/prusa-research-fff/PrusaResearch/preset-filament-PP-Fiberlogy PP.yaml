kind: filament
id: Fiberlogy PP
inherits:
- '*PP*'
- '*sheets_PP_fiberlogypp*'
- '*fiberlogypp_MAXVOLSPEED_PP*'
name: Fiberlogy PP
values:
  filament_vendor: Fiberlogy
  first_layer_temperature: 245
  temperature: 245
  filament_cost: 36.67
  filament_density: 1.05
  extrusion_multiplier: 1.05
  filament_spool_weight: 330
  disable_fan_first_layers: 5
  min_fan_speed: 0
  max_fan_speed: 25
  fan_below_layer_time: 100
  fan_always_on: true
  wipe: nil
variants:
- condition: printer.base_model == "COREONE"
  id: ce68ae08-99a9-4932-8275-c6d49f95ebb6
  values:
    bridge_fan_speed: 60
    min_fan_speed: 10
    max_fan_speed: 20
    fan_below_layer_time: 30
    fan_always_on: false
- condition: printer.model == "MK4S"
  id: 57471d0f-d85f-479b-aaed-7f0e9909e2e4
  values:
    bridge_fan_speed: 50
    min_fan_speed: 10
    max_fan_speed: 15
    fan_below_layer_time: 25
    fan_always_on: false
---
kind: filament
id: '*sheets_PP_fiberlogypp*'
variants:
# STANDARD sheet
- condition: sheet.type != "PP"
  id: e03c33eb-e335-452d-888a-9c7d15baa7b3
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
  # variants:
  # - condition: printer.model == "MINI"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 105
      # bed_temperature: 105
# PP sheet
- condition: sheet.type == "PP"
  id: 853c6d58-1953-4c53-abe6-40a64fca11af
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
