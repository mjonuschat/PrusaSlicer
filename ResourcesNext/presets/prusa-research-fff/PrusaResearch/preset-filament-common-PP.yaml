kind: filament
id: '*PP*'
inherits:
- '*common*'
- '*sheets_PP_common*'
features:
  $.type: PP
values:
  bridge_fan_speed: 70
  cooling: 1
  cooling_slowdown_logic: uniform_cooling
  disable_fan_first_layers: 2
  enable_dynamic_fan_speeds: 0
  end_filament_gcode: ; Filament-specific end gcode
  extrusion_multiplier: 1.05
  fan_always_on: 1
  fan_below_layer_time: 30
  filament_abrasive: 0
  filament_cooling_final_speed: 3.4
  filament_cooling_initial_speed: 2.2
  filament_cooling_moves: 4
  filament_cost: 70
  filament_density: 0.89
  deretract_speed: 20
  filament_diameter: 1.75
  filament_infill_max_crossing_speed: 0
  filament_infill_max_speed: 0
  filament_load_time: 0
  filament_loading_speed: 28
  filament_loading_speed_start: 3
  filament_max_volumetric_speed: 4
  filament_minimal_purge_on_wipe_tower: 15
  filament_multitool_ramming: 0
  filament_multitool_ramming_flow: 10
  filament_multitool_ramming_volume: 10
  filament_purge_multiplier: 100%
  filament_ramming_parameters: 120 100 6.6 6.8 7.2 7.6 7.9 8.2 8.7 9.4 9.9 10.0| 0.05 6.6 0.45 6.8 0.95 7.8 1.45 8.3 1.95 9.7 2.45 10 2.95 7.6 3.45 7.6 3.95 7.6 4.45 7.6 4.95 7.6
  retract_before_travel: 2
  retract_layer_change: false
  retract_restart_extra_toolchange: null
  retract_speed: 60
  seam_gap_distance: null
  filament_shrinkage_compensation_xy: 0%
  filament_shrinkage_compensation_z: 0%
  filament_spool_weight: 212
  filament_stamping_loading_speed: 20
  filament_toolchange_delay: 0
  travel_lift_before_obstacle: null
  travel_max_lift: 0.6
  travel_ramping_lift: null
  travel_slope: null
  filament_type: PP
  filament_unload_time: 0
  filament_unloading_speed: 90
  filament_unloading_speed_start: 100
  filament_vendor: Generic
  wipe: false
  full_fan_speed_layer: 0
  idle_temperature: 70
  max_fan_speed: 50
  min_fan_speed: 10
  min_print_speed: 15
  overhang_fan_speed_0: 0
  overhang_fan_speed_1: 0
  overhang_fan_speed_2: 0
  overhang_fan_speed_3: 0
  slowdown_below_layer_time: 15
  pressure_advance_value: 0
  first_layer_temperature: 235
  temperature: 235
