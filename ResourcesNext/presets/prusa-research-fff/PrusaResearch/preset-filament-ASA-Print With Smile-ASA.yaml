kind: filament
id: Print With Smile ASA
inherits:
- '*ASA*'
name: Print With Smile ASA
values:
  filament_vendor: Print With Smile
  filament_cost: 30
  filament_density: 1.07
  filament_spool_weight: 330
  fan_always_on: 0
  cooling: 1
  min_fan_speed: 25
  max_fan_speed: 40
  bridge_fan_speed: 70
  min_print_speed: 15
  slowdown_below_layer_time: 20
  first_layer_temperature: 250
  temperature: 250
  first_layer_bed_temperature: 105
  bed_temperature: 110
  fan_below_layer_time: 30
  disable_fan_first_layers: 4
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    first_layer_bed_temperature: 110
    enable_dynamic_fan_speeds: 1
    min_fan_speed: 20
    max_fan_speed: 25
    min_print_speed: 15
    bridge_fan_speed: 25
    fan_below_layer_time: 20
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 10
      pressure_advance_enable: true
      pressure_advance_value: 0.09
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 10
      pressure_advance_enable: true
      pressure_advance_value: 0.065
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 10
      pressure_advance_enable: true
      pressure_advance_value: 0.02
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 26
        pressure_advance_enable: true
        pressure_advance_value: 0.02
        temperature: 255
        first_layer_temperature: 255
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 12
      pressure_advance_enable: true
      pressure_advance_value: 0.018
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 27
        pressure_advance_enable: true
        pressure_advance_value: 0.018
        temperature: 255
        first_layer_temperature: 255
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 15
      fan_below_layer_time: 35
      pressure_advance_enable: true
      pressure_advance_value: 0.012
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 34
        temperature: 255
        first_layer_temperature: 255
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 18
      slowdown_below_layer_time: 20
      fan_below_layer_time: 20
      max_fan_speed: 30
      bridge_fan_speed: 30
      overhang_fan_speed_3: 25
      pressure_advance_enable: true
      pressure_advance_value: 0.01
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 36
        temperature: 260
        first_layer_temperature: 260
