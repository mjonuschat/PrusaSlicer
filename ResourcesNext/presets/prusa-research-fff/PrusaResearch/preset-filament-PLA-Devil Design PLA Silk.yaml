kind: filament
id: Devil Design PLA Silk
inherits:
- '*PLASILK*'
- '*DDPLASilk_P_ADVANCE_PLA*'
name: Devil Design PLA Silk
values:
  filament_cost: '20'
  filament_density: 1.23
  filament_vendor: Devil Design
  filament_spool_weight: 250
  first_layer_temperature: 235
  temperature: 235
---        
kind: filament
# Pressure advance values
id: '*DDPLASilk_P_ADVANCE_PLA*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.07
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.05
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.022
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.022
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.015
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.015
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.013
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.013
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.009
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.009
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.55
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.18
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.1
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.075
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
