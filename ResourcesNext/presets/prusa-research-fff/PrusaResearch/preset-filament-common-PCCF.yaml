kind: filament
id: '*PCCF*'
inherits:
- '*common*'
- '*PC*'
features:
  $.type: PC
  $.tags: [abrasive, contains_carbon_fiber]
  $.properties.min_nozzle_diameter: 0.4
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  extrusion_multiplier: 1.04
  filament_cost: 74.99
  temperature: 285
  first_layer_temperature: 285
  filament_abrasive: true
  fan_below_layer_time: 10
  filament_vendor: Generic
## C1
variants:
