kind: filament
id: '*PCCF*'
inherits:
- '*common*'
- '*PC*'
features:
  $.type: 'PC'
  $.tags: ['abrasive','contains_carbon_fiber']
  $.properties.min_nozzle_diameter: 0.4
condition: 'printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/'
values:
  extrusion_multiplier: 1.04
  filament_cost: 74.99
  temperature: 285
  first_layer_temperature: 285
  filament_abrasive: true
  fan_below_layer_time: 10
  filament_vendor: Generic
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    min_fan_speed: 15
    max_fan_speed: 30
    bridge_fan_speed: 25
    overhang_fan_speed_0: 20
    fan_below_layer_time: 15
    start_filament_gcode: M142 S36 ; set heatbreak target temp
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    name: '*PCCF* @COREONE 0.25'
    values:
      filament_max_volumetric_speed: 9
      slowdown_below_layer_time: 20
      pressure_advance_value: 0.14
      filament_infill_max_crossing_speed: 100
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    name: '*PCCF* @COREONE 0.3'
    values:
      filament_max_volumetric_speed: 9
      slowdown_below_layer_time: 20
      pressure_advance_value: 0.09
      filament_infill_max_crossing_speed: 100
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: '*PCCF* @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 9
      slowdown_below_layer_time: 20
      pressure_advance_value: 0.05
      filament_infill_max_crossing_speed: 100
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: '*PCCF* @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 9
        filament_ramming_parameters: 250 100 42.4194 42.4194| 0.05 42.4387 0.45 42.4387 0.95 42.4387 1.45 42.4387 1.95 42.4387 2.45 42.4387 2.95 42.4387 3.45 42.4387 3.95 42.4387 4.45 42.4387 4.95 42.4387
        pressure_advance_value: 0.05
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: '*PCCF* @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 10
      pressure_advance_value: 0.035
      filament_infill_max_crossing_speed: 100
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      name: '*PCCF* @COREONE HF0.5'
      values:
        filament_max_volumetric_speed: 10
        # filament_ramming_parameters: 250 100 42.4194 42.4194| 0.05 42.4387 0.45 42.4387 0.95 42.4387 1.45 42.4387 1.95 42.4387 2.45 42.4387 2.95 42.4387 3.45 42.4387 3.95 42.4387 4.45 42.4387 4.95 42.4387
        pressure_advance_value: 0.035
        filament_infill_max_crossing_speed: 110
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: '*PCCF* @COREONE 0.6'
    values:
      filament_max_volumetric_speed: 13
      slowdown_below_layer_time: 20
      fan_below_layer_time: 18
      pressure_advance_value: 0.025
      filament_infill_max_crossing_speed: 120
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      name: '*PCCF* @COREONE HF0.6'
      values:
        filament_max_volumetric_speed: 13
        # filament_ramming_parameters: 250 100 42.4194 42.4194| 0.05 42.4387 0.45 42.4387 0.95 42.4387 1.45 42.4387 1.95 42.4387 2.45 42.4387 2.95 42.4387 3.45 42.4387 3.95 42.4387 4.45 42.4387 4.95 42.4387
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    name: '*PCCF* @COREONE 0.8'
    values:
      filament_max_volumetric_speed: 18
      slowdown_below_layer_time: 25
      fan_below_layer_time: 25
      max_fan_speed: 30
      bridge_fan_speed: 30
      overhang_fan_speed_3: 30
      pressure_advance_value: 0.016
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      name: '*PCCF* @COREONE HF0.8'
      values:
        filament_max_volumetric_speed: 18
        # filament_ramming_parameters: 250 100 42.4194 42.4194| 0.05 42.4387 0.45 42.4387 0.95 42.4387 1.45 42.4387 1.95 42.4387 2.45 42.4387 2.95 42.4387 3.45 42.4387 3.95 42.4387 4.45 42.4387 4.95 42.4387
