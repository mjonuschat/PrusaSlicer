        pressure_advance_value: 0.05
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 8a0cbcdc-dbe0-4317-a9b9-2586cae6acd8
    name: '*PCCF* @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 10
      pressure_advance_value: 0.035
      filament_infill_max_crossing_speed: 100
    variants:
    # C1 HF0.5
