  id: c42aa7ca-b5b7-413b-b682-959a35c1718b
  values:
    min_fan_speed: 15
    max_fan_speed: 30
    bridge_fan_speed: 25
    overhang_fan_speed_0: 20
    fan_below_layer_time: 15
    start_filament_gcode: M142 S36 ; set heatbreak target temp
    filament_shrinkage_compensation_xy: 0%
    filament_shrinkage_compensation_z: 0.18%
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 3f0e0647-80da-43bc-a1fd-af221995a076
    name: '*PCCF* @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 9
      slowdown_below_layer_time: 20
      pressure_advance_value: 0.05
      filament_infill_max_crossing_speed: 100
    variants:
    # C1 HF0.4
