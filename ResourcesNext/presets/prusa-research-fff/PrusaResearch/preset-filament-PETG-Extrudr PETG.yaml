kind: filament
id: Extrudr PETG
inherits:
- '*PET*'
name: Extrudr PETG
values:
  filament_vendor: Extrudr
  bed_temperature: 75
  first_layer_bed_temperature: 75
  first_layer_temperature: 220
  temperature: 220
  filament_cost: 35.45
  full_fan_speed_layer: 3
  filament_density: 1.29
  filament_spool_weight: 262
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    idle_temperature: 130
    bridge_fan_speed: 35
    overhang_fan_speed_0: 30
    fan_below_layer_time: 25
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    name: 'Extrudr PETG @COREONE 0.25'
    values:
      filament_max_volumetric_speed: 12
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    name: 'Extrudr PETG @COREONE 0.3'
    values:
      filament_max_volumetric_speed: 12
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: 'Extrudr PETG @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 12
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: 'Extrudr PETG @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 15
        first_layer_temperature: 230
        temperature: 230
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: 'Extrudr PETG @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 14
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      name: 'Extrudr PETG @COREONE HF0.5'
      values:
        filament_max_volumetric_speed: 16
        first_layer_temperature: 230
        temperature: 230
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: 'Extrudr PETG @COREONE 0.6'
    values:
      filament_max_volumetric_speed: 17
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      name: 'Extrudr PETG @COREONE HF0.6'
      values:
        filament_max_volumetric_speed: 18
        first_layer_temperature: 230
        temperature: 230
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    name: 'Extrudr PETG @COREONE 0.8'
    values:
      filament_max_volumetric_speed: 18
      slowdown_below_layer_time: 20
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      name: 'Extrudr PETG @COREONE HF0.8'
      values:
        filament_max_volumetric_speed: 22
        first_layer_temperature: 235
        temperature: 235
