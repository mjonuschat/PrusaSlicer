kind: filament
id: Forward AM Ultrafuse PP
inherits:
- '*PP*'
- '*sheets_PP_ultrafusepp*'
- '*ultrafusepp_MAXVOLSPEED_PP*'
name: Forward AM Ultrafuse PP
values:
  filament_vendor: Forward AM
  first_layer_temperature: 240
  temperature: 240
  extrusion_multiplier: 1
  filament_density: 0.91
  bridge_fan_speed: 100
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 100
  max_fan_speed: 100
  fan_always_on: false
  fan_below_layer_time: 60
  min_print_speed: 10
  wipe: nil
  retract_lift: nil
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: ed9d97d8-f48c-4fbc-81ae-1a0275b455f3
  values:
    min_fan_speed: 70
    max_fan_speed: 70
    bridge_fan_speed: 70
---
kind: filament
id: '*sheets_PP_ultrafusepp*'
variants:
# STANDARD sheet
- condition: sheet.type != "PP"
  id: c8fa6279-816b-4d1b-8e1d-1d0dff60501a
  values:
    first_layer_bed_temperature: 80
    bed_temperature: 70
  # variants:
  # - condition: printer.model == "MINI"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 105
      # bed_temperature: 105
# PP sheet
- condition: sheet.type == "PP"
  id: 727b5f9a-1099-4862-ad0f-7447aff67e0b
  values:
    first_layer_bed_temperature: 80
    bed_temperature: 70
---
