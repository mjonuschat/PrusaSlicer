kind: filament
id: addnorth Textura
inherits:
- '*PLA*'
- '*sheets_addnorth_textura*'
name: addnorth Textura
values:
  bridge_fan_speed: 60
  filament_vendor: addnorth
  extrusion_multiplier: 0.95
  filament_cost: 24.99
  min_fan_speed: 20
  max_fan_speed: 40
  fan_below_layer_time: 25
  slowdown_below_layer_time: 8
  min_print_speed: 20
variants:
  ## C1
- condition: printer.base_model == "COREONE"
  values:
    enable_dynamic_fan_speeds: 1
    min_fan_speed: 15
    max_fan_speed: 30
    bridge_fan_speed: 45
    fan_below_layer_time: 25
    temperature: 220
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 8
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 10
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 20
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 12
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 24
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15.5
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 27
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 19
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 35
## XL
- condition: printer.base_model == "XL"
  values:
    slowdown_below_layer_time: 10
  variants:
  # XL 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 8
      slowdown_below_layer_time: 7
  # XL 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 9
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 10
    variants:
    # XL HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 20
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 11
    variants:
    # XL HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 24
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15.5
      slowdown_below_layer_time: 15
      min_print_speed: 15
    variants:
    # XL HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 27
        start_filament_gcode: M142 S36 ; set heatbreak target temp
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 19
      slowdown_below_layer_time: 19
    variants:
    # XL HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 35
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  variants:
  # MK4 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 8
      slowdown_below_layer_time: 5
  # MK4 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 6
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 8
    variants:
    # MK4 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 20
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 10
    variants:
    # MK4 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 25
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15.5
      slowdown_below_layer_time: 15
    variants:
    # MK4 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 28
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 19
      slowdown_below_layer_time: 17
    variants:
    # MK4 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 35
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  values:
    enable_dynamic_fan_speeds: 1
    min_fan_speed: 15
    max_fan_speed: 30
    bridge_fan_speed: 45
    min_print_speed: 20
    overhang_fan_speed_0: 35
    fan_below_layer_time: 17
  variants:
  # MK4S 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 8
      slowdown_below_layer_time: 4
  # MK4S 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 5
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 6
    variants:
    # MK4S HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 20
  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 8
    variants:
    # MK4S HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 25
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15.5
      fan_below_layer_time: 22
      slowdown_below_layer_time: 10
    variants:
    # MK4S HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 28
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 19
      fan_below_layer_time: 25
      slowdown_below_layer_time: 15
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 35
## MK3.5
- condition: printer.base_model == "MK3.5"
  values:
    first_layer_temperature: 220
    temperature: 220
  variants:
  # MK3.5 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 10
  # MK3.5 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 12
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 12
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 12
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 17
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 15
      temperature: 225
## MINI
- condition: printer.base_model == "MINI"
  values:
    first_layer_temperature: 225
    temperature: 220
  variants:
  # MINI 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 10
  # MINI 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 15
  # MINI 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 18
  # MINI 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 20
      temperature: 225
## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model=~/(MK3|MK2.5)/
  values:
    first_layer_temperature: 215
    temperature: 215
  variants:
  # MK3 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 10
  # MK3 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 12
  # MK3 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 17
  # MK3 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 20
      temperature: 225
## MK2S
- condition: printer.model == "MK2S"
  values:
    first_layer_temperature: 215
    temperature: 215
  variants:
  # MK2 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 7
      slowdown_below_layer_time: 12
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 15
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 13
      slowdown_below_layer_time: 20
## MK2S MMU1
- condition: printer.model == "MK2SMM"
  values:
    first_layer_temperature: 215
    temperature: 215
  variants:
  # MK2SMM 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 1210
  # MK2SMM 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 10
      slowdown_below_layer_time: 15
  # MK2SMM 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 13
      slowdown_below_layer_time: 20
---        
kind: filament
id: '*sheets_addnorth_textura*'      
variants:        
# STANDARD sheet
- condition: sheet.type != "cold"        
  values:
    first_layer_bed_temperature: 65
    bed_temperature: 65
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 60
      # bed_temperature: 60
# COLD sheet
- condition: sheet.type == "cold"
  values:
    first_layer_bed_temperature: 30
    bed_temperature: 30