kind: filament
id: Forward AM Ultrafuse PET-CF15
inherits:
- '*PETCF*'
- '*sheets_PET_UltrafusePETCF15*'
- '*UltrafusePETCF15_MAXVOLSPEED*'
name: Forward AM Ultrafuse PET-CF15
# 0.6 nozzle and bigger
condition: tool.nozzle_diameter >= 0.6 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Forward AM
  filament_type: PET
  first_layer_bed_temperature: 270
  temperature: 270
  extrusion_multiplier: 1
  filament_density: 1.36
  filament_spool_weight: 0
  bridge_fan_speed: 100
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 60
  max_fan_speed: 100
  fan_below_layer_time: 30
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: 5cb16bbe-7184-4e4f-9677-48890690cecb
  values:
    bridge_fan_speed: 70
    min_fan_speed: 40
    max_fan_speed: 70
---
kind: filament
id: '*sheets_PET_UltrafusePETCF15*'
variants:
# STANDARD sheet
- condition: sheet.type != "cold"
  id: c15f8eb8-7764-4cd9-9820-98b79e42e714
  values:
    first_layer_bed_temperature: 75
    bed_temperature: 75
# COLD sheet
- condition: sheet.type == "cold"
  id: 742482cb-5952-4c02-8ef7-55c32c9b8e56
  values:
    first_layer_bed_temperature: 60
    bed_temperature: 60
---
kind: filament
# Maximum volumetric speed limits
id: '*UltrafusePETCF15_MAXVOLSPEED*'
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  id: 7a17c6a1-a8af-42cb-bd4e-641bbbac59c2
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 11701c9f-4802-4f85-823f-196a6f6c4d4a
    values:
      filament_max_volumetric_speed: 8
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 0aff2b7c-d797-42ad-a70c-9939a60759df
    values:
      filament_max_volumetric_speed: 9
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 9c30bacc-5e56-43af-ac21-ab1e6a4c7aa9
    values:
      filament_max_volumetric_speed: 10
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: aea69893-eedb-4055-9407-04de7188b8d5
    values:
      filament_max_volumetric_speed: 13
