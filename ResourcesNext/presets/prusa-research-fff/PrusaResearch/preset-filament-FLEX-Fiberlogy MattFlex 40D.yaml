kind: filament
id: Fiberlogy MattFlex 40D
inherits:
- '*FLEX*'
name: Fiberlogy MattFlex 40D
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: Fiberlogy
  first_layer_temperature: 230
  temperature: 230
  first_layer_bed_temperature: 60
  bed_temperature: 60
  filament_cost: 39.41
  disable_fan_first_layers: 5
  full_fan_speed_layer: 5
  extrusion_multiplier: 1.1
  filament_density: 1.16
  filament_spool_weight: 330
  bridge_fan_speed: 75
  min_fan_speed: 25
  max_fan_speed: 75
  retract_length: 2.2
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 14e0eded-c062-472d-8af6-e0e0352ab440
  values:
    bridge_fan_speed: 60
    min_fan_speed: 20
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 7d08378c-b918-4859-8d5c-ce17cb4748dc
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 103eaa02-70bf-470c-8adf-0c343851b813
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: e4e42b07-274f-4522-8e81-0db5e701acc3
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 171fb1cd-226b-4962-8696-795f8e4be0ef
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  id: 7be37bed-c612-415d-8746-d5e010779e7a
