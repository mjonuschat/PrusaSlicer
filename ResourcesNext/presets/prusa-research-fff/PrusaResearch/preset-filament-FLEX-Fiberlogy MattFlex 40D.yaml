kind: filament
id: Fiberlogy MattFlex 40D
inherits:
- '*FLEX*'
name: Fiberlogy MattFlex 40D
condition: 'tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"'
values:
  filament_vendor: Fiberlogy
  first_layer_temperature: 230
  temperature: 230
  first_layer_bed_temperature: 60
  bed_temperature: 60
  filament_cost: 39.41
  disable_fan_first_layers: 5
  full_fan_speed_layer: 5
  extrusion_multiplier: 1.1
  filament_density: 1.16
  filament_spool_weight: 330
  bridge_fan_speed: 75
  min_fan_speed: 25
  max_fan_speed: 75
  retract_length: 2.2
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    bridge_fan_speed: 60
    min_fan_speed: 20
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  values:
    retract_length_toolchange: 2.2
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 4.5
      filament_multitool_ramming_flow: 4.5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 4
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 6
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  values:
    bridge_fan_speed: 60
    min_fan_speed: 20
    max_fan_speed: 60
  variants:
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 4
  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 6
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  values:
    extrusion_multiplier: 1.1
    first_layer_temperature: 240
    temperature: 240
    idle_temperature: 70
    deretract_speed: 25
    retract_length: 1
    retract_speed: 50
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 1.35
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 1.35
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 1.35
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 1.5
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 4
## MINI
- condition: printer.base_model == "MINI"
  values:
    extrusion_multiplier: 1.15
    first_layer_temperature: 240
    temperature: 240
    idle_temperature: 70
    retract_speed: 40
    deretract_speed: 15
    retract_before_travel: 5
    retract_length: 4
    travel_ramping_lift: 0
    retract_lift: 0
  variants:
  # MINI 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 1.5
  # MINI 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 1.5
  # MINI 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 3