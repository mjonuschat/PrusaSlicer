kind: tool_print
id: '*common MK2*'
variants:
- condition: printer.model == "MK2S" and feeder.base_model != "MMU1"
  id: 48df82f8-6aca-4a15-b439-c224f6a49bca
  values:
    retract_layer_change: true
    retract_length_toolchange: 0
    retract_lift_above: 0
    retract_lift_below: 199
    retract_restart_extra: 0
    retract_restart_extra_toolchange: 0
    travel_ramping_lift: 0
    travel_slope: 1
    travel_max_lift: 1.5
    wipe: 1
    retract_speed: 35
    deretract_speed: 0
    retract_length: 0.8
  variants:
# 0.25    
  - condition: tool.nozzle_diameter == 0.25
    id: dc5bda07-3b43-4c83-b9b5-3e1d256732d6
    values:
      max_layer_height: 0.15
      min_layer_height: 0.05
      nozzle_diameter: 0.25
      retract_lift: 0.15
# 0.4    
  - condition: tool.nozzle_diameter == 0.4
    id: d47e8777-effd-4e1e-be61-351bd25c2998
    values:
      max_layer_height: 0.30
      min_layer_height: 0.07
      nozzle_diameter: 0.4
      retract_lift: 0.4
      retract_before_travel: 1.5
# 0.6    
  - condition: tool.nozzle_diameter == 0.6
    id: 14e88b95-54f9-4531-ba92-2628a4f77ec6
    values:
      max_layer_height: 0.40
      min_layer_height: 0.15
      nozzle_diameter: 0.6
      retract_length: 0.8
      retract_lift: 0.4
      deretract_speed: 25
- condition: printer.model == "MK2S" and feeder.base_model == "MMU1"
  id: 1ccfbf06-dc38-431e-a54e-8c4e4d854712
  values:
    retract_layer_change: false
    retract_length_toolchange: 4
    retract_lift_above: 0
    retract_lift_below: 199
    retract_restart_extra: 0
    retract_restart_extra_toolchange: 0
    retract_lift: 0.6
    wipe: 1
    retract_speed: 80
    deretract_speed: 50
    retract_length: 4
    retract_before_travel: 3
    retract_before_wipe: 60%
  variants:
# 0.25    
  - condition: tool.nozzle_diameter == 0.25
    id: f113c2e7-231c-447a-9720-842985cc2b24
    values:
      max_layer_height: 0.15
      min_layer_height: 0.05
      nozzle_diameter: 0.25
      retract_lift: 0.4
# 0.4    
  - condition: tool.nozzle_diameter == 0.4
    id: d8880843-00b1-49a0-b961-757ffa77d9a6
    values:
      max_layer_height: 0.30
      min_layer_height: 0.07
      nozzle_diameter: 0.4
# 0.6    
  - condition: tool.nozzle_diameter == 0.6
    id: b274f033-f265-495b-9fed-e5be82fc2e10
    values:
      max_layer_height: 0.40
      min_layer_height: 0.15
      nozzle_diameter: 0.6
