    extrusion_multiplier: 1
    first_layer_temperature: 195
    temperature: 200
    idle_temperature: 70
    deretract_speed: 25
    retract_speed: 40
    retract_length: 1
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 4
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 4c3b0797-a714-4ec7-9e43-8b5c249e4c4f
