      filament_max_volumetric_speed: 4
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 48575e67-1f81-44f7-88fe-35797286a83a
    values:
      filament_max_volumetric_speed: 6
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 3d48a87e-6289-4b56-af8b-6a0010a7734a
    values:
      filament_max_volumetric_speed: 10
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: ff92d58d-b05b-4d1c-b538-ee9122f79cb2
  values:
    bridge_fan_speed: 25
    min_fan_speed: 15
    max_fan_speed: 20
  variants:
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 66f9a4c3-a89a-447e-bc10-92cbecd6a1f3
