kind: filament
id: addnorth OBC Polyethylene
inherits:
- '*FLEX*'
name: addnorth OBC Polyethylene
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: addnorth
  first_layer_bed_temperature: 100
  bed_temperature: 100
  first_layer_temperature: 195
  temperature: 200
  extrusion_multiplier: 1
  bridge_fan_speed: 40
  min_fan_speed: 20
  max_fan_speed: 30
  fan_below_layer_time: 15
  min_print_speed: 20
  slowdown_below_layer_time: 5
  retract_length: 1.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 9c72c604-8a3c-4b32-8ba3-b0de48b7ac09
  values:
    bridge_fan_speed: 25
    min_fan_speed: 15
    max_fan_speed: 20
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: fd16f24b-8f85-41cc-ae83-18e179c8b8fd
    values:
      filament_max_volumetric_speed: 4
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 3422ada9-9c11-431d-8905-6816c5411578
    values:
      filament_max_volumetric_speed: 4
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: e022d68b-4e8d-4eaa-bc40-7c4126462ab2
    values:
      filament_max_volumetric_speed: 6
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 3bb109a9-1551-4777-8e3f-3d44ada82ede
    values:
      filament_max_volumetric_speed: 10
## XL
- condition: printer.base_model == "XL"
  id: 1f9acaac-fd8a-4e68-8c6d-04dfd37b1f2b
  values:
    retract_length_toolchange: 1.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 69e446ea-1a6b-4695-baf3-7392b69a4ab6
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 9fd96eb1-0ceb-49d5-88de-129fedb1dd7d
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 4cc7d53c-478d-4dae-9a54-0e1e1ae28054
    values:
      filament_max_volumetric_speed: 6
      filament_multitool_ramming_flow: 6
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 7b32a58e-f89c-472a-b568-38fa575293d6
    values:
      filament_max_volumetric_speed: 10
      filament_multitool_ramming_flow: 10
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: fcba2299-6760-477a-a3c0-11967586fb82
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: e0f7f078-2695-4f9e-ab97-68903275eb86
    values:
      filament_max_volumetric_speed: 4
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: a23fb0d0-429e-481f-8ad3-0ca71e8f8581
