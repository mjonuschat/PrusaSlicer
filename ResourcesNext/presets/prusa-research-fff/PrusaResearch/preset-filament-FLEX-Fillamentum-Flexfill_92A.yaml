kind: filament
id: Fillamentum Flexfill 92A
inherits:
- '*FLEX*'
name: Fillamentum Flexfill 92A
values:
  temperature: 240
  first_layer_temperature: 240
  filament_cost: 33.99
  filament_density: 1.2
  extrusion_multiplier: 1.1
  filament_spool_weight: 230
  filament_max_volumetric_speed: 3.5
  retract_length: 3.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    chamber_minimal_temperature: 0
    chamber_temperature: 30
    bridge_fan_speed: 70
    max_fan_speed: 50
    idle_temperature: 150
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 4
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  values:
    filament_multitool_ramming_volume: 40
    retract_length_toolchange: 3.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3.5
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5.5
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 9.5
    variants:
    # MK4 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 9.5
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  values:
    bridge_fan_speed: 70
    max_fan_speed: 50
  variants:
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3.5
  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5.5
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 9.5
## MK3.5
- condition: printer.base_model == "MK3.5"
  values:
    extrusion_multiplier: 1.15
    first_layer_temperature: 240
    temperature: 240
    idle_temperature: 70
    deretract_speed: 20
    retract_length: 0.4
    retract_before_travel:
    retract_speed:
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 1.2
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 1.2
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 1.3
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 1.5
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 4
## MINI
- condition: printer.base_model == "MINI"
  values:
    extrusion_multiplier: 1.15
    first_layer_temperature: 240
    temperature: 240
    idle_temperature: 70
    retract_speed: 40
    deretract_speed: 15
    retract_before_travel: 7
    retract_length: 3
    travel_ramping_lift: 0
    retract_lift: 0
  variants:
  # MINI 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 1.2
  # MINI 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 1.2
  # MINI 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 3
## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model=~/(MK3|MK2.5)/
  values:
    extrusion_multiplier: 1.15
    first_layer_temperature: 240
    temperature: 240
    idle_temperature: 70
    cooling: 0
    fan_always_on: 0
    min_fan_speed: 70
    max_fan_speed: 90
    slowdown_below_layer_time: 15
    retract_speed:
    deretract_speed: 20
    retract_length: 0.4
    retract_lift: 0
    travel_ramping_lift: 0
  variants:
  # MK3 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 1.2
  # MK3 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 1.2
  # MK3 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 4
## MK2S
- condition: printer.model == "MK2S"
  values:
    extrusion_multiplier: 1.15
    first_layer_temperature: 240
    temperature: 240
    idle_temperature: 70
    cooling: 0
    fan_always_on: 0
    min_fan_speed: 70
    max_fan_speed: 90
    slowdown_below_layer_time: 15
    retract_speed:
    deretract_speed: 20
    retract_length: 0.4
    retract_lift: 0
    travel_ramping_lift: 0
  variants:
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 1.2
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 1.2
