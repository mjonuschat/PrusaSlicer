    travel_speed: 300
    travel_speed_z: 12
    thick_bridges: 0
    top_solid_min_thickness: 0.7
    bottom_solid_min_thickness: 0.5
    wipe_tower_extra_spacing: 110%
    wipe_tower_extra_flow: 250%
