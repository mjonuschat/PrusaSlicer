kind: filament
id: Fiberlogy Easy ABS
inherits:
- '*ABS*'
name: Fiberlogy Easy ABS
values:
  bed_temperature: 100
  first_layer_bed_temperature: 100
  first_layer_temperature: 250
  temperature: 250
  filament_cost: 22.67
  filament_vendor: Fiberlogy
  filament_density: 1.09
  filament_spool_weight: 330
  disable_fan_first_layers: 5
## C1
variants:
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      first_layer_temperature: 255
      temperature: 255
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 255
        temperature: 255
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 255
        temperature: 255
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 255
        temperature: 255
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 255
      temperature: 255
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        temperature: 260
        first_layer_temperature: 260
