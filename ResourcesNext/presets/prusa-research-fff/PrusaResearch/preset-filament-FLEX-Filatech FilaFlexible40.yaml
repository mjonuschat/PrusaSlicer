kind: filament
id: Filatech FilaFlexible40
inherits:
- '*FLEX*'
name: Filatech FilaFlexible40
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Filatech
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 50
  max_fan_speed: 50
  extrusion_multiplier: 1.1
  filament_density: 1.15
  first_layer_temperature: 230
  temperature: 230
  retract_length: 2.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 196a90cc-d399-4eec-880f-c89d9d50a6ef
  values:
    bridge_fan_speed: 70
    min_fan_speed: 35
    max_fan_speed: 40
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 9b94887c-bdd1-4c1d-8991-530dab6f4705
    values:
      filament_max_volumetric_speed: 4
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 1f787ec5-9910-4df7-80e5-7ae8995948b4
    values:
      filament_max_volumetric_speed: 4
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: e4fdfcb7-2b2f-41c1-96b2-6f9d3403c8c0
    values:
      filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 9d83c4a2-9a96-4ea7-9207-0641ec3cda22
    values:
      filament_max_volumetric_speed: 10
