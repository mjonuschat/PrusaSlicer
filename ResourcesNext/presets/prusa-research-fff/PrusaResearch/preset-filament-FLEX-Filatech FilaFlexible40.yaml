kind: filament
id: Filatech FilaFlexible40
inherits:
- '*FLEX*'
name: Filatech FilaFlexible40
condition: 'tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/'
values:
  filament_vendor: Filatech
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 50
  max_fan_speed: 50
  extrusion_multiplier: 1.1
  filament_density: 1.15
  first_layer_temperature: 230
  temperature: 230
  retract_length: 2.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    bridge_fan_speed: 70
    min_fan_speed: 35
    max_fan_speed: 40
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 4
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
## XL
- condition: printer.base_model == "XL"
  values:
    retract_length_toolchange: 2.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5
      filament_multitool_ramming_flow: 5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
      filament_multitool_ramming_flow: 10
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 4
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  values:
    bridge_fan_speed: 70
    min_fan_speed: 35
    max_fan_speed: 40
  variants:
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 4
  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  values:
    extrusion_multiplier: 1.1
    first_layer_temperature: 230
    temperature: 230
    idle_temperature: 70
    deretract_speed: 25
    retract_length: 2
    retract_speed: 50
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 2.5
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 2.5
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 2.5
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 4
## MINI
- condition: printer.base_model == "MINI"
  values:
    extrusion_multiplier: 1.15
    first_layer_temperature: 240
    temperature: 240
    retract_before_travel: 5
    retract_length: 4
    travel_ramping_lift: 0
    retract_lift: 0
  variants:
  # MINI 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 1.8
  # MINI 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 1.8
  # MINI 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 3