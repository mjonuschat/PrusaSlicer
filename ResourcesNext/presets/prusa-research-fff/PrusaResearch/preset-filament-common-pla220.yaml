      name: '*PLA220* @MK3.5 0.4 MMU'
      values:
        temperature: 205
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: '*PLA220* @MK3.5 0.5'
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: '*PLA220* @MK3.5 0.6'
    variants:
    # MK3.5 0.6 MMU
