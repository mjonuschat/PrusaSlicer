## MK3.5
- condition: printer.base_model == "MK3.5"
  values:
    temperature: 220
  variants:
  # MK3.5 0.25
  - condition: tool.nozzle_diameter == 0.25
    name: '*PLA220* @MK3.5 0.25'
    values:
      temperature: 220
    variants:
    # MK3.5 0.25 MMU
    - condition: feeder.base_model == "MMU"
      name: '*PLA220* @MK3.5 0.25 MMU'
      values:
        temperature: 205
  # MK3.5 0.3
  - condition: tool.nozzle_diameter == 0.3
    name: '*PLA220* @MK3.5 0.3'
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: '*PLA220* @MK3.5 0.4'
    variants:
    # MK3.5 0.4 MMU
