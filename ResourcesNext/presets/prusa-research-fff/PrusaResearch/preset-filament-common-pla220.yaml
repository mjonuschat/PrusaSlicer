kind: filament
id: '*PLA220*'
inherits:
- '*common*'
- '*PLA*'
values:
  first_layer_temperature: 215
  temperature: 215
variants:
  ## C1
- condition: printer.base_model == "COREONE"
  values:
    temperature: 220
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    name: '*PLA220* @COREONE 0.25'
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    name: '*PLA220* @COREONE 0.3'
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: '*PLA220* @COREONE 0.4'
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: '*PLA220* @COREONE HF0.4'
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: '*PLA220* @COREONE 0.5'
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      name: '*PLA220* @COREONE HF0.5'
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: '*PLA220* @COREONE 0.6'
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      name: '*PLA220* @COREONE HF0.6'
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    name: '*PLA220* @COREONE 0.8'
    values:
      temperature: 230
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      name: '*PLA220* @COREONE HF0.8'
