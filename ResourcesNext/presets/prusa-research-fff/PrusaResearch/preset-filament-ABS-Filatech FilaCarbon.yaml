kind: filament
id: Filatech FilaCarbon
inherits:
- '*ABSCF*'
- '*FilaCarbon_MAXVOLSPEED*'
name: Filatech FilaCarbon
values:
  filament_vendor: Filatech
  extrusion_multiplier: 0.95
  filament_density: 1.1
  first_layer_temperature: 255
  temperature: 255
---
kind: filament
# Maximum volumetric speed limits
id: '*FilaCarbon_MAXVOLSPEED*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 9
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 10
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 18
- condition: printer.base_model=~/(MK3|MK3.5|MINI|MK2)/
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 9
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 10
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 18
  
