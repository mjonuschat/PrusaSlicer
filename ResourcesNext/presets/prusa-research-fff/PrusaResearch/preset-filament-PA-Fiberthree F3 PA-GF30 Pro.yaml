kind: filament
id: Fiberthree F3 PA-GF30 Pro
inherits:
- '*PACF*'
- '*f3pagf30_MAXVOLSPEED_PACF*'
name: Fiberthree F3 PA-GF30 Pro
# No MINI
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Fiberthree
  first_layer_temperature: 275
  temperature: 285
  disable_fan_first_layers: 4
  extrusion_multiplier: 1.03
  filament_cost: 208.01
  filament_density: 1.35
  filament_spool_weight: 0
  min_fan_speed: 15
  max_fan_speed: 15
  fan_below_layer_time: 20
  slowdown_below_layer_time: 20
  fan_always_on: false
  # Bed temperature global
  first_layer_bed_temperature: 90
  bed_temperature: 90
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: 3a9c702c-a5f5-40b2-aa27-1575e9c62092
  values:
    min_fan_speed: 12
    max_fan_speed: 12
