kind: filament
id: addnorth Adamant S1
inherits:
- '*FLEX*'
name: addnorth Adamant S1
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: addnorth
  bridge_fan_speed: 60
  min_fan_speed: 40
  max_fan_speed: 70
  fan_below_layer_time: 15
  slowdown_below_layer_time: 20
  extrusion_multiplier: 1
  first_layer_temperature: 245
  temperature: 250
  filament_density: 1.22
  retract_length: 1.5
  retract_lift: 0.2
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: ceab931c-c0cb-496f-9a77-ef8ac5a6a719
  values:
    bridge_fan_speed: 40
    min_fan_speed: 30
    max_fan_speed: 50
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 5ac658af-86c0-438e-a739-51c1d67218c1
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 71dea25d-37bb-4a81-af80-5322e1dc854c
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: f4589375-e106-4882-bb34-b69adbd936ee
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: d90bff2f-cf6c-4be8-98fc-b90d4814ae99
    values:
      filament_max_volumetric_speed: 9
## XL
- condition: printer.base_model == "XL"
  id: 82bd80d6-c3cc-4d99-ab71-66673a0f2828
  values:
    retract_length_toolchange: 1.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 457556b1-2d3d-47e6-8922-a61dbdc13336
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 3143a833-92b9-4b74-863c-4712d3600fa9
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: b49e2d77-64d7-4f31-9f93-5ba16220ddee
    values:
      filament_max_volumetric_speed: 4.5
      filament_multitool_ramming_flow: 4.5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: d9b93ac9-ae8e-49fb-9b39-03e280b94cef
    values:
      filament_max_volumetric_speed: 9
      filament_multitool_ramming_flow: 9
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: fe74ae30-c363-4372-b2b9-3edbf6bb8845
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 2eb65c82-f5e8-477a-a11a-9ae13611b2db
    values:
      filament_max_volumetric_speed: 3
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: bc11e88b-217c-4c81-bca0-60a7e232e655
    values:
      filament_max_volumetric_speed: 3
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 26d9360a-7ad3-4200-a844-9a1f1901ed08
    values:
      filament_max_volumetric_speed: 4.5
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 31bafb85-1fbe-45d0-a924-c08479f113a2
    values:
      filament_max_volumetric_speed: 9
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: 4e3e02d6-d5df-44cb-bc24-fe2f7e5d5d6c
  values:
    bridge_fan_speed: 40
    min_fan_speed: 30
    max_fan_speed: 50
  variants:
