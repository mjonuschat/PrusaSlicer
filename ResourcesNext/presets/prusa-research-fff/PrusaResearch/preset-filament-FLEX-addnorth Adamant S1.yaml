    idle_temperature: 70
    deretract_speed: 25
    retract_speed: 40
    retract_lift: 0.5
    retract_length: 0.6
    retract_restart_extra: 0.1
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 4
