kind: filament
id: Extrudr BioFusion
inherits:
- '*PLA*'
name: Extrudr BioFusion
values:
  filament_vendor: Extrudr
  disable_fan_first_layers: 3
  min_fan_speed: 25
  max_fan_speed: 45
  filament_cost: 31.23
  filament_density: 1.25
  filament_spool_weight: 230
variants:
 ## C1
- condition: printer.base_model == "COREONE"
  values:
    min_fan_speed: 20
    max_fan_speed: 35
    bridge_fan_speed: 70
    overgang_fan_speed_0: 70
## MK4S
- condition: printer.model == "MK4S"
  values:
    min_fan_speed: 20
    max_fan_speed: 35
    bridge_fan_speed: 70
    overgang_fan_speed_0: 70
## MK3.5
- condition: printer.base_model == "MK3.5"
  values:
    first_layer_temperature: 230
    temperature: 225
    min_fan_speed: 25
    max_fan_speed: 45
    bridge_fan_speed: 100
## MINI
- condition: printer.base_model == "MINI"
  values:
    first_layer_temperature: 230
    temperature: 225
    min_fan_speed: 25
    max_fan_speed: 45
    bridge_fan_speed: 100
## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model == "MK3"
  values:
    first_layer_temperature: 220
    temperature: 220
    min_fan_speed: 25
    max_fan_speed: 45
    bridge_fan_speed: 100
## MK2S
- condition: printer.model == "MK2S"
  values:
    first_layer_temperature: 220
    temperature: 220
    min_fan_speed: 25
    max_fan_speed: 45
    bridge_fan_speed: 100
## MK2S MMU1
- condition: printer.model == "MK2SMM"
  values:
    first_layer_temperature: 220
    temperature: 220
    min_fan_speed: 25
    max_fan_speed: 45
    bridge_fan_speed: 100