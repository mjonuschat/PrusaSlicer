kind: filament
id: '*PEBA*'
inherits:
- '*common*'
features:
  $.type: PEBA
values:
  bed_temperature: 90
  bridge_fan_speed: 50
  cooling: 1
  disable_fan_first_layers: 3
  end_filament_gcode: ; Filament-specific end gcode
  extrusion_multiplier: 1
  fan_always_on: 1
  fan_below_layer_time: 20
  filament_colour: ''
  filament_cooling_final_speed: 2.5
