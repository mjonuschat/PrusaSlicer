kind: filament
id: Eolas Prints TPU93A
inherits:
- '*FLEX*'
name: Eolas Prints TPU93A
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: Eolas Prints
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 70
  max_fan_speed: 90
  extrusion_multiplier: 1.1
  filament_density: 1.21
  filament_cost: 34.99
  first_layer_temperature: 240
  temperature: 235
  first_layer_bed_temperature: 30
  bed_temperature: 30
  cooling: false
  fan_always_on: false
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: d76bae24-2acf-404f-92a7-29434ef78840
  values:
    bridge_fan_speed: 70
    min_fan_speed: 40
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 62c18b0c-be5b-48a8-9186-26784a5b9503
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 8a0630d9-e41d-427c-bd85-e5efbc7b0abb
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 8e60ee5f-4291-4a16-a058-a7a0d0f44449
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 6ae2a9cd-8923-4f94-824b-ec825c52e792
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  id: 4fbaec42-e620-4161-ac48-ee538e9638ad
  values:
    retract_length_toolchange: 2.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: a4ddd603-1e9e-4dce-9461-9454465a48f7
    values:
      filament_max_volumetric_speed: 2.5
      filament_multitool_ramming_flow: 2.5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 20b4f48c-292c-4470-9328-b98fb0ebb76a
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: d5aa0965-84d8-4f8a-acef-be82ef1fc51d
    values:
      filament_max_volumetric_speed: 4.5
      filament_multitool_ramming_flow: 4.5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: bb8f1a04-362c-4e69-b2f0-3ebfde12a34f
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: 4dbd3f2e-24b5-453b-a8e0-1373fee3f59f
  values:
    bridge_fan_speed: 70
    min_fan_speed: 40
    max_fan_speed: 60
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  id: 44e86baf-127f-4a40-9bc7-f1b2b6749742
  values:
    extrusion_multiplier: 1.16
    idle_temperature: 70
    deretract_speed: 25
    retract_length: 0
    retract_speed: 50
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 1.2
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 37636054-7b4f-4950-ba07-89b31dd05f19
    values:
      filament_max_volumetric_speed: 1.2
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: bcaa6026-ff97-4aed-b29a-45a3302e48f9
    values:
      filament_max_volumetric_speed: 1.2
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 009d93d0-77c9-4ed4-a93d-6065fedcc9a9
    values:
      filament_max_volumetric_speed: 2.5
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 18045b91-4df3-4f86-bd88-0b538dd79d06
    values:
      filament_max_volumetric_speed: 3
