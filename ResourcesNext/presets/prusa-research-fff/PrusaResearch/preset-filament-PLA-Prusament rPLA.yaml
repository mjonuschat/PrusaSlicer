kind: filament
id: Prusament rPLA
inherits:
- '*PLA*'
name: Prusament rPLA
values:
  filament_vendor: Prusa Polymers
  filament_cost: '37.49'
  filament_density: 1.24
  filament_spool_weight: 193
  first_layer_temperature: 205
  temperature: 205
variants:
