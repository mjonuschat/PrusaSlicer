kind: filament
id: Forward AM Ultrafuse TPU-64D
inherits:
- '*FLEX*'
name: Forward AM Ultrafuse TPU-64D
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: Forward AM
  first_layer_temperature: 230
  temperature: 225
  extrusion_multiplier: 1
  filament_density: 1.16
  fan_below_layer_time: 30
  slowdown_below_layer_time: 15
  filament_spool_weight: 0
  min_fan_speed: 20
  max_fan_speed: 100
  retract_length: 3
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 02aa696f-a2ad-4926-abc7-6e8be23ff61d
  values:
    min_fan_speed: 20
    max_fan_speed: 80
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 6fc217b9-e508-4979-a028-846bab461299
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: a0381a99-18cc-466c-a394-54fa9f4b376f
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: bc56bb05-e4f8-4d5f-a216-e8863b2deb1e
    values:
      filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: d447a52a-a99c-4b65-9238-3dae9f106d27
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  id: 9bb75ada-7ed8-4353-86ea-b52d1079f610
  values:
    retract_length_toolchange: 3
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: e32d2bb0-40d9-4348-a29f-c7208bc48ffb
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 64167b5d-2765-4aab-837a-6530fc66c256
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 75acbb22-3414-47de-8875-d0ffa184dc7a
    values:
      filament_max_volumetric_speed: 5
      filament_multitool_ramming_flow: 5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: fba77415-1a59-4883-b897-62e7a434abc6
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: 0affb757-bc8c-49a2-b96f-e9a6f1f4eaef
  values:
    min_fan_speed: 20
    max_fan_speed: 80
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 7cbfe254-4bb9-49e3-8ae8-0b2a85201717
    values:
      filament_max_volumetric_speed: 3.5
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 713c0afe-ae38-4e38-acbc-028ca41d0f75
    values:
      filament_max_volumetric_speed: 3.5
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: d77e5675-e329-4eca-8b13-c85c739df14f
    values:
      filament_max_volumetric_speed: 6
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 01609995-208f-42a6-ba52-00b8f98723ae
    values:
      filament_max_volumetric_speed: 8.5
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: 5c0098ec-cdd1-462e-a5ee-54e95e1a6e45
  values:
    min_fan_speed: 20
    max_fan_speed: 80
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 32f7f4ff-5299-4d23-bb41-3e2562c92478
    values:
      filament_max_volumetric_speed: 3.5
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: cdccad38-8ef3-455b-be10-111c2e31c4a1
    values:
      filament_max_volumetric_speed: 3.5
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 2f15aad3-4f4b-415e-b145-9cce90907bb4
    values:
      filament_max_volumetric_speed: 6
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 4bac9223-bacb-4a2a-9fb0-c473ac12746f
