      filament_max_volumetric_speed: 8.5
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  id: a6207953-4726-45d5-aa52-53c49d5c9c4e
  values:
    extrusion_multiplier: 1.2
    idle_temperature: 70
    deretract_speed: 25
    retract_length: 1.2
    retract_speed: 25
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 3
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 2618ec0c-75fa-4e37-a871-e7590ae33cbd
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 01443c8f-9487-468f-ace2-31552c7abda2
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 294bdfe0-0353-4977-960b-c1b701beda14
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 5656abcc-f772-4f76-87c9-b8b5b0ecf2e5
    values:
      filament_max_volumetric_speed: 4
