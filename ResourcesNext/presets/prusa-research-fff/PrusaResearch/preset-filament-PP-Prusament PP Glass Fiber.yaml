kind: filament
id: Prusament PP Glass Fiber
inherits:
- '*PPCF*'
- '*prusamentppgf_MAXVOLSPEED_PPCF*'
name: Prusament PP Glass Fiber
features:
  $.type: PP
  $.tags: [abrasive, contains_glass_fiber]
  $.properties.min_nozzle_diameter: 0.4
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Prusa Polymers
  extrusion_multiplier: 1.03
  filament_density: 1.05
  cooling: true
  disable_fan_first_layers: 5
  full_fan_speed_layer: 0
  min_fan_speed: 15
  max_fan_speed: 20
  fan_below_layer_time: 25
  first_layer_temperature: 245
  temperature: 245
  first_layer_bed_temperature: 100
  bed_temperature: 95
  pressure_advance_value: 0
  travel_ramping_lift: nil
  retract_length: 2
  retract_speed: 60
  deretract_speed: 20
  retract_before_travel: 2
  wipe: true
  retract_before_wipe: 80%
variants:
- condition: printer.base_model == "COREONE"
  id: c6cf4c30-874a-4c9c-8c63-2f0894586f95
  values:
    chamber_temperature: 0
    minimal_chamber_temperature: 0
    min_fan_speed: 10
    max_fan_speed: 15
    bridge_fan_speed: 70
    idle_temperature: 120
- condition: printer.model == "MK4S"
  id: 8f1c13b9-6130-4bed-9fac-1ec6ff782c6f
  values:
    min_fan_speed: 10
    max_fan_speed: 15
    bridge_fan_speed: 70
- condition: printer.base_model == "XL"
  id: 9d691431-285b-40c6-a8ea-cbb3ed0ea5b8
  values:
    filament_multitool_ramming: false
    filament_multitool_ramming_flow: 5
    filament_multitool_ramming_volume: 40
    retract_length_toolchange: 2
    retract_before_wipe: nil
    min_fan_speed: 10
    max_fan_speed: 25
    bridge_fan_speed: 70
    travel_max_lift: 0.6
    idle_temperature: 70
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 4ec7341b-6026-454b-9f3b-02568d9892b8
    values:
      filament_multitool_ramming_flow: 5
      filament_multitool_ramming_volume: 40
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: cf577e55-e0a7-447a-beaf-813be5ec8373
    values:
      filament_multitool_ramming_flow: 6
      filament_multitool_ramming_volume: 40
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: bb27eef4-9f9d-45bd-8c74-141517709d11
    values:
      filament_multitool_ramming_flow: 7.5
      filament_multitool_ramming_volume: 40
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: fd0c679d-4a0a-49ce-b478-545b9e06ad8c
    values:
      filament_multitool_ramming_flow: 10
      filament_multitool_ramming_volume: 40
---
