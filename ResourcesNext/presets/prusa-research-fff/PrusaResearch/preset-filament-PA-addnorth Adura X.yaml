kind: filament
id: addnorth Adura X
inherits:
- '*PACF*'
- '*adurax_MAXVOLSPEED_PACF*'
name: addnorth Adura X
# No MINI
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: addnorth
  filament_density: 1.27
  first_layer_temperature: 265
  temperature: 270
  extrusion_multiplier: 0.98
  first_layer_bed_temperature: 105
  bed_temperature: 115
  bridge_fan_speed: 70
  disable_fan_first_layers: 3
  min_fan_speed: 20
  max_fan_speed: 40
  min_print_speed: 20
  filament_cost: 29.99
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: 23b3dad6-a883-4001-b499-b2739fcb1183
  values:
    min_fan_speed: 12
    max_fan_speed: 25
    bridge_fan_speed: 45
- condition: printer.base_model=~/(MK2|MK3|MK3.5)/
  id: ef099225-6fa6-4bca-a7ef-7352b77fa8d4
  values:
    retract_length: 1.4
---
