        filament_max_volumetric_speed: 17
        pressure_advance_value: 0.033
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 44abfdb9-18f2-4aec-8a21-9fe88eb993e2
    name: '*PETCF* @COREONE 0.8'
    values:
      filament_max_volumetric_speed: 22
