kind: filament
id: '*PETCF*'
inherits:
- '*PET*'
features:
  $.type: PETG
  $.tags: [abrasive]
  $.properties.min_nozzle_diameter: 0.4
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  extrusion_multiplier: 1.03
  filament_cost: 54.99
  filament_density: 1.27
  filament_diameter: 1.75
  first_layer_temperature: 265
  temperature: 265
  filament_abrasive: true
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 43aa20af-1649-4559-b554-eb61892ab3be
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: c213a758-be02-4298-addd-9e298cdcca0e
    name: '*PETCF* @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 9
      pressure_advance_value: 0.053
      filament_infill_max_crossing_speed: 110
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      id: 851532d6-a130-4412-8c98-5bfe69820e60
      name: '*PETCF* @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 12
        pressure_advance_value: 0.047
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 7e846169-6ee2-4861-8ed0-1fb7c7852958
    name: '*PETCF* @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 14
      slowdown_below_layer_time: 10
      pressure_advance_value: 0.042
      filament_infill_max_crossing_speed: 110
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      id: 69526c03-831f-4aaa-92d5-8459fb46a4ff
      name: '*PETCF* @COREONE HF0.5'
      values:
        filament_max_volumetric_speed: 14
        pressure_advance_value: 0.042
        filament_infill_max_crossing_speed: 120
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 6cccd602-618d-47be-92e3-05d2198ce22e
    name: '*PETCF* @COREONE 0.6'
    values:
      filament_max_volumetric_speed: 17
      slowdown_below_layer_time: 15
      fan_below_layer_time: 30
      pressure_advance_value: 0.032
      filament_infill_max_crossing_speed: 140
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      id: fbc35f14-b224-418f-9915-db8dc7e3b279
      name: '*PETCF* @COREONE HF0.6'
