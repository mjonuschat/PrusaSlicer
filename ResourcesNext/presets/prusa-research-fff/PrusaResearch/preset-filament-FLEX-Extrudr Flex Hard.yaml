kind: filament
id: Extrudr Flex Hard
inherits:
- '*FLEX*'
name: Extrudr Flex Hard
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: Extrudr
  first_layer_temperature: 240
  temperature: 240
  filament_cost: 39.98
  disable_fan_first_layers: 1
  extrusion_multiplier: 1.1
  filament_density: 1.2
  filament_spool_weight: 230
  min_fan_speed: 70
  max_fan_speed: 90
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: f8cdff34-a181-4cc9-9bfd-b113a65b706b
  values:
    bridge_fan_speed: 70
    min_fan_speed: 40
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: e05d7913-e1cd-4ccf-951b-c47a4a9e3ff1
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 73be20af-aa5e-40b7-96b5-8720686f7a90
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 39bbe702-2f40-49a6-90da-62ea49ab9fb7
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 2d537bf6-8ab0-4cc6-a709-77a72f5fe299
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  id: 923c8864-e90f-47d9-8b46-c5ac53169501
  values:
    retract_length_toolchange: 2.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 8e576c99-b780-4fd2-9b84-90cf7df733fd
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 346de075-cfbd-4bf6-aa78-27cc3cc34cb0
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 2b6341e8-6bcd-48a9-abce-81b31c9ea990
    values:
      filament_max_volumetric_speed: 4.5
      filament_multitool_ramming_flow: 4.5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: b8072f4c-a407-405d-9906-41ffbf010da8
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: 8fc25f5b-90e3-4091-a880-4590a97f7011
  values:
    bridge_fan_speed: 70
    min_fan_speed: 40
    max_fan_speed: 60
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  id: f5761964-22bf-442f-8e85-a1d0e11d757b
  values:
    extrusion_multiplier: 1.2
    first_layer_temperature: 240
    temperature: 240
    idle_temperature: 70
    deretract_speed: 25
    retract_length: 0.4
    retract_speed: 50
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 3
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 9a370d9b-5ec4-4780-b9a3-3786c097352a
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 840447b5-f9df-40c5-ab15-548cb56d12c8
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 32ab61c4-c81f-4282-ba99-754c0e0acad4
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 94c935f8-74db-4b9b-b42b-a561ee100124
    values:
      filament_max_volumetric_speed: 4
