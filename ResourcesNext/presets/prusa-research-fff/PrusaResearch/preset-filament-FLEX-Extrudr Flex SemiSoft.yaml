kind: filament
id: Extrudr Flex SemiSoft
inherits:
- '*FLEX*'
name: Extrudr Flex SemiSoft
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: Extrudr
  first_layer_temperature: 240
  temperature: 240
  filament_cost: 39.98
  disable_fan_first_layers: 1
  extrusion_multiplier: 1.1
  filament_density: 1.18
  filament_spool_weight: 230
  min_fan_speed: 70
  max_fan_speed: 90
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 3de50dd6-ea7c-4300-9c23-88484f4d718b
  values:
    bridge_fan_speed: 70
    min_fan_speed: 40
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: c5488727-2f11-4bec-a8b5-e1c8dcc8b585
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 8a651383-6282-4c8c-a201-e3075dd3db8e
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: e7634b6b-1e55-4748-a916-c94dfb9add75
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: bbb57b64-141b-4a5d-9272-3e160df57c1c
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  id: 882e6f05-7bdf-4ac8-9668-465d5474536c
  values:
    retract_length_toolchange: 2.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 7011d6de-2cb7-4b8b-a931-c2161b2aee11
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 138e377f-a41d-4fd3-b8ed-40eadcafe48d
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 0f840e0c-f5db-4f73-a9f5-73985d78f76f
    values:
      filament_max_volumetric_speed: 4.5
      filament_multitool_ramming_flow: 4.5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 1621f7a1-cb9b-4abb-bfbf-c7893f3b01a3
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: 03dffd69-ddc8-456d-ad1b-c795ed869ec1
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 15d992e6-be1a-4ced-9847-8bd9943bcdb8
    values:
      filament_max_volumetric_speed: 3
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 7e74cf46-5b84-4b8d-9573-b05712596a01
