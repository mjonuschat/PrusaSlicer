  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 95b79464-009d-4d7b-9bd6-af41816d5337
    values:
      filament_max_volumetric_speed: 1.8
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 99be4795-0331-4c42-9d78-db86b792df9c
    values:
      filament_max_volumetric_speed: 2.2
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
