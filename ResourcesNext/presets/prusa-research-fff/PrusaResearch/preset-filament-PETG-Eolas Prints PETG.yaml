kind: filament
id: Eolas Prints PETG
inherits:
- '*PET*'
name: Eolas Prints PETG
values:
  filament_vendor: Eolas Prints
  bed_temperature: 80
  first_layer_temperature: 240
  temperature: 240
  filament_cost: 29.99
  full_fan_speed_layer: 3
  min_fan_speed: 15
  max_fan_speed: 40
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    idle_temperature: 130
    min_fan_speed: 13
    max_fan_speed: 30
    bridge_fan_speed: 35
    overhang_fan_speed_0: 30
    fan_below_layer_time: 25
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    name: 'Eolas Prints PETG @COREONE 0.25'
    values:
      filament_max_volumetric_speed: 12
      temperature: 240
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    name: 'Eolas Prints PETG @COREONE 0.3'
    values:
      filament_max_volumetric_speed: 12
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: 'Eolas Prints PETG @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 12
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: 'Eolas Prints PETG @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 21
        first_layer_temperature: 250
        temperature: 250
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: 'Eolas Prints PETG @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 14
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      name: 'Eolas Prints PETG @COREONE HF0.5'
      values:
        filament_max_volumetric_speed: 24
        first_layer_temperature: 250
        temperature: 250
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: 'Eolas Prints PETG @COREONE 0.6'
    values:
      filament_max_volumetric_speed: 17
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      name: 'Eolas Prints PETG @COREONE HF0.6'
      values:
        filament_max_volumetric_speed: 27
        first_layer_temperature: 250
        temperature: 250
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    name: 'Eolas Prints PETG @COREONE 0.8'
    values:
      filament_max_volumetric_speed: 22
      slowdown_below_layer_time: 20
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      name: 'Eolas Prints PETG @COREONE HF0.8'
      values:
        filament_max_volumetric_speed: 34
        first_layer_temperature: 255
        temperature: 255
