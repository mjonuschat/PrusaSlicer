kind: filament
id: Prusament Woodfill
inherits:
- '*PLAFILL*'
name: Prusament Woodfill
values:
  filament_vendor: Prusa Polymers
  extrusion_multiplier: 1
  filament_cost: '39.9'
  filament_density: 1.2
  filament_spool_weight: 193
  first_layer_temperature: 195
  temperature: 195
variants:
  ## C1
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: 'Prusament Woodfill @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 10
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: 'Prusament Woodfill @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 10
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: 'Prusament Woodfill @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 10
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      name: 'Prusament Woodfill @COREONE HF0.5'
      values:
        filament_max_volumetric_speed: 10
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: 'Prusament Woodfill @COREONE 0.6'
    values:
      filament_max_volumetric_speed: 12
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      name: 'Prusament Woodfill @COREONE HF0.6'
      values:
        filament_max_volumetric_speed: 12
  # C1 0.8
