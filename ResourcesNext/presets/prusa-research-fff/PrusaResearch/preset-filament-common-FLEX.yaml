kind: filament
id: '*FLEX*'
#condition: 'tool.nozzle_diameter >= 0.4'
values:
  bed_temperature: 50
  bridge_fan_speed: 80
  chamber_minimal_temperature: 0
  chamber_temperature: 0
  cooling: 1
  disable_fan_first_layers: 3
  enable_dynamic_fan_speeds: 0
  end_filament_gcode: ; Filament-specific end gcode
  extrusion_multiplier: 1.08
  fan_always_on: 1
  fan_below_layer_time: 100
  filament_abrasive: 0
  filament_colour: '#008000'
  filament_cooling_final_speed: 3.4
  filament_cooling_initial_speed: 2.2
  filament_cooling_moves: 4
  filament_cost: 82
  filament_density: 1.22
  deretract_speed: 20
  filament_diameter: 1.75
  filament_infill_max_crossing_speed: 0
  filament_infill_max_speed: 0
  filament_load_time: 0
  filament_loading_speed: 28
  filament_loading_speed_start: 3
  filament_max_volumetric_speed: 3
  filament_minimal_purge_on_wipe_tower: 15
  filament_multitool_ramming: 0
  filament_multitool_ramming_flow: 10
  filament_multitool_ramming_volume: 10
  filament_purge_multiplier: 100%
  filament_ramming_parameters: 120 100 6.6 6.8 7.2 7.6 7.9 8.2 8.7 9.4 9.9 10.0| 0.05 6.6 0.45 6.8 0.95 7.8 1.45 8.3 1.95 9.7 2.45 10 2.95 7.6 3.45 7.6 3.95 7.6 4.45 7.6 4.95 7.6
  retract_before_travel: 2
  retract_before_wipe:
  retract_layer_change:
  retract_length: 2.5
  retract_length_toolchange:
  retract_lift: 0
  retract_lift_above:
  retract_lift_below:
  retract_restart_extra:
  retract_restart_extra_toolchange:
  retract_speed: 60
  seam_gap_distance:
  filament_shrinkage_compensation_xy: 0%
  filament_shrinkage_compensation_z: 0%
  filament_soluble: 0
  filament_spool_weight: 0
  filament_stamping_distance: 0
  filament_stamping_loading_speed: 20
  filament_toolchange_delay: 0
  travel_lift_before_obstacle:
  travel_max_lift: 0.6
  travel_ramping_lift:
  travel_slope:
  filament_type: FLEX
  filament_unload_time: 0
  filament_unloading_speed: 90
  filament_unloading_speed_start: 100
  wipe: 0
  first_layer_bed_temperature: 50
  first_layer_temperature: 230
  full_fan_speed_layer: 0
  idle_temperature: 70
  max_fan_speed: 60
  min_fan_speed: 30
  min_print_speed: 15
  slowdown_below_layer_time: 10
  start_filament_gcode: M142 S36 ; set heatbreak target temp
  pressure_advance: 0
  temperature: 230
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    chamber_minimal_temperature: 0
    chamber_temperature: 30
    bridge_fan_speed: 70
    max_fan_speed: 50
    idle_temperature: 150
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: '*FLEX* @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 2.5
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: '*FLEX* @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 2.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: '*FLEX* @COREONE 0.5'
    values:
      filament_max_volumetric_speed: 2.5
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      name: '*FLEX* @COREONE HF0.5'
      values:
        filament_max_volumetric_speed: 2.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: '*FLEX* @COREONE 0.6'
    values:
      filament_max_volumetric_speed: 3.5
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      name: '*FLEX* @COREONE HF0.6'
      values:
        filament_max_volumetric_speed: 3.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    name: '*FLEX* @COREONE 0.8'
    values:
      filament_max_volumetric_speed: 7.5
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      name: '*FLEX* @COREONE HF0.8'
      values:
        filament_max_volumetric_speed: 7.5
## XL
- condition: printer.base_model == "XL"
  values:
    filament_multitool_ramming_flow: 2.5
    filament_multitool_ramming_volume: 40
    retract_length_toolchange: 2.5
    idle_temperature: 70
    filament_minimal_purge_on_wipe_tower: 35
    travel_ramping_lift: 1
    travel_max_lift: 1.5
    travel_slope: 1
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: '*FLEX* @XL 0.4'
    values:
      filament_max_volumetric_speed: 2.5
    variants:
    # XL HF0.4
    - condition: tool.nozzle_high_flow
      name: '*FLEX* @XL HF0.4'
      values:
        filament_max_volumetric_speed: 2.5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: '*FLEX* @XL 0.5'
    values:
      filament_max_volumetric_speed: 2.5
    variants:
    # XL HF0.5
    - condition: tool.nozzle_high_flow
      name: '*FLEX* @XL HF0.5'
      values:
        filament_max_volumetric_speed: 2.5
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    name: '*FLEX* @XL 0.6'
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
    variants:
    # XL HF0.6
    - condition: tool.nozzle_high_flow
      name: '*FLEX* @XL HF0.6'
      values:
        filament_max_volumetric_speed: 3.5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    name: '*FLEX* @XL 0.8'
    values:
      filament_max_volumetric_speed: 7.5
      filament_multitool_ramming_flow: 7.5
    variants:
    # XL HF0.8
    - condition: tool.nozzle_high_flow
      name: '*FLEX* @XL HF0.8'
      values:
        filament_max_volumetric_speed: 7.5
## MK4
- condition: printer.model == "MK4"
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: '*FLEX* @MK4 0.4'
    values:
      filament_max_volumetric_speed: 3
