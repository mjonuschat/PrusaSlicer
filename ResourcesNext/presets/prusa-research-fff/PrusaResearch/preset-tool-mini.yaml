kind: tool_print
id: '*common MINI*'
variants:
- condition: printer.model == "MINI"
  id: e5340a39-a060-4686-a597-214e1aa7c178
  values:
    retract_layer_change: 1
    retract_length_toolchange: 0
    retract_lift_above: 0
    retract_lift_below: 179
    retract_restart_extra: 0
    retract_restart_extra_toolchange: 0
    travel_ramping_lift: 0
    travel_slope: 1
    travel_max_lift: 1.5
    wipe: 0
    retract_speed: 70
    deretract_speed: 40
    retract_length: 2.5
  variants:
# 0.25    
  - condition: tool.nozzle_diameter == 0.25
    id: a161a9a0-b8db-4671-baa2-b6f134b62c04
    values:
      max_layer_height: 0.15
      min_layer_height: 0.05
      nozzle_diameter: 0.25
      retract_lift: 0.15
# 0.4    
  - condition: tool.nozzle_diameter == 0.4
    id: 6e015e98-9c95-479c-ae70-165af340555f
    values:
      max_layer_height: 0.25
      min_layer_height: 0.07
      nozzle_diameter: 0.4
      retract_lift: 0.2
      retract_before_travel: 1.5
# 0.6    
  - condition: tool.nozzle_diameter == 0.6
    id: b56f2070-2cc7-4e68-9ebf-46b3dac3c213
    values:
      max_layer_height: 0.40
      min_layer_height: 0.15
      nozzle_diameter: 0.6
      retract_length: 2.8
      retract_lift: 0.2

# 0.8    
  - condition: tool.nozzle_diameter == 0.8
    id: 1c335140-a63a-4b65-8a83-298256afa95e
    values:
      deretract_speed: 20
      max_layer_height: 0.55
      min_layer_height: 0.2
      nozzle_diameter: 0.8
      retract_length: 0.6
      retract_lift: 0.25
      retract_speed: 45
