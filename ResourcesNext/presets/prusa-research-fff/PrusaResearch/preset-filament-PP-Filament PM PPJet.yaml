kind: filament
id: Filament PM PPJet
inherits:
- '*PP*'
- '*ppjet_MAXVOLSPEED_PP*'
- '*sheets_PP_ppjet*'
name: Filament PM PPJet
values:
  filament_vendor: Filament PM
  extrusion_multiplier: 1.15
  filament_cost: 33.99
  filament_spool_weight: 0
  bridge_fan_speed: 80
  disable_fan_first_layers: 3
  min_fan_speed: 20
  max_fan_speed: 40
  fan_below_layer_time: 100
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: 97842420-60e8-481e-b3a9-6f4c46a9c0dd
  values:
    min_fan_speed: 20
    max_fan_speed: 30
    bridge_fan_speed: 50
    retract_length: 2.5
- condition: printer.base_model=~/(XL|MK4)/
  id: 566668b3-9b22-4027-856a-bde6971c9ec4
  values:
    retract_length: 2.5
- condition: printer.base_model=~/(MK3|MK3.5)/
  id: fba59582-8890-4e00-857b-06d4614d5788
  values:
    retract_length: 1
    deretract_speed: 25
    retract_lift: 0.4
---
kind: filament
id: '*sheets_PP_ppjet*'
variants:
# STANDARD sheet
- condition: sheet.type != "PP"
  id: 8666427b-c606-473e-9602-afca10170d1d
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
  # variants:
  # - condition: printer.model == "MINI"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 105
      # bed_temperature: 105
# PP sheet
- condition: sheet.type == "PP"
  id: 5e1855eb-9b1c-42a4-8c8b-1dda78607ab7
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
