kind: filament
id: Forward AM Ultrafuse TPC-45D
inherits:
- '*FLEX*'
name: Forward AM Ultrafuse TPC-45D
condition: tool.nozzle_diameter >= 0.4 and printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/ and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Forward AM
  first_layer_temperature: 235
  temperature: 235
  first_layer_bed_temperature: 60
  bed_temperature: 60
  extrusion_multiplier: 1
  filament_density: 1.15
  cooling: true
  fan_always_on: true
  fan_below_layer_time: 30
  min_fan_speed: 10
  max_fan_speed: 50
  retract_length: 1.2
  retract_speed: 25
variants:
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  id: 64db4410-9a8c-499d-b547-504c8046d7e8
  values:
    first_layer_temperature: 235
    temperature: 235
    first_layer_bed_temperature: 60
    bed_temperature: 60
    extrusion_multiplier: 1
    filament_density: 1.15
    cooling: true
    fan_always_on: true
    fan_below_layer_time: 30
    min_fan_speed: 10
    max_fan_speed: 50
    retract_length: 1.2
    retract_speed: 25
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 3cff0514-1e88-4721-a380-96af58e5be5f
    values:
      filament_max_volumetric_speed: 1.2
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 024cc0c2-bb8c-4181-94dc-528a39cac6e9
    values:
      filament_max_volumetric_speed: 1.2
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: fc7cb0a5-a9fc-46bc-acdc-325c61fbe321
    values:
      filament_max_volumetric_speed: 1.5
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: dba7378b-c29f-4a08-b215-d73821160167
    values:
      filament_max_volumetric_speed: 2.5
