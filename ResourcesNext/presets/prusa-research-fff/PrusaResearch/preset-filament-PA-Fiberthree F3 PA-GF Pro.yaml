kind: filament
id: Fiberthree F3 PA-GF Pro
inherits:
- '*PACF*'
- '*f3pagf_MAXVOLSPEED_PACF*'
name: Fiberthree F3 PA-GF Pro
# No MINI
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Fiberthree
  first_layer_temperature: 285
  temperature: 285
  extrusion_multiplier: 1
  filament_cost: 205.68
  filament_density: 1.27
  filament_spool_weight: 0
  min_fan_speed: 15
  max_fan_speed: 15
  fan_below_layer_time: 20
  # Bed temperature global
  first_layer_bed_temperature: 90
  bed_temperature: 90
  fan_always_on: true
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: 6e8f7619-7fea-412b-8a1e-90ae2790f0ea
  values:
    min_fan_speed: 12
    max_fan_speed: 12
- condition: printer.base_model=~/(MK2|MK3|MK3.5)/
  id: 4d9af20e-1158-49bd-9648-f90bb0ec73a0
  values:
    retract_length: 2
    retract_speed: 40
    wipe: false
---
