        temperature: 255
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  # MK3.5 0.25
  - condition: tool.nozzle_diameter == 0.25
    variants:
    # MK3.5 0.25 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 2
  # MK3.5 0.3
  - condition: tool.nozzle_diameter == 0.3
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    variants:
    # MK3.5 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 7
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 14
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
      max_fan_speed: 45
    variants:
    # MK3.5 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 13
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 20
      first_layer_temperature: 250
      temperature: 250
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # MINI 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 10
      temperature: 240
  # MINI 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 10
  # MINI 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
  # MINI 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 15
      first_layer_temperature: 250
      temperature: 250
## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model=~/(MK3|MK2.5)/
  variants:
  # MK3 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 10
    variants:
    # MK3 0.25 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 2
  # MK3 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 12
    variants:
    # MK3 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 7
  # MK3 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
      slowdown_below_layer_time: 17
    variants:
    # MK3 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 13
  # MK3 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 20
      first_layer_temperature: 250
      temperature: 250
## MK2S
- condition: printer.model == "MK2S"
  values:
    filament_max_volumetric_speed: 8
  variants:
  # MK2 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 15
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 15
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
## MK2S MMU1
- condition: printer.model == "MK2SMM"
  values:
    filament_max_volumetric_speed: 8
  variants:
  # MK2 0.25
  - condition: tool.nozzle_diameter == 0.25
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 12