kind: filament
id: Overture PETG
inherits:
- '*PET*'
name: Overture PETG
values:
  filament_vendor: Overture
  first_layer_temperature: 250
  temperature: 250
  filament_cost: 25
## C1
variants:
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 12
      pressure_advance_value: 0.18
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 12
      pressure_advance_value: 0.1
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
      pressure_advance_value: 0.055
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 22
        first_layer_temperature: 250
        temperature: 250
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 14
      pressure_advance_value: 0.044
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 25
        first_layer_temperature: 250
        temperature: 250
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 17
      pressure_advance_value: 0.035
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 29
        first_layer_temperature: 250
        temperature: 250
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 22
      slowdown_below_layer_time: 20
      pressure_advance_value: 0.02
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 35
        first_layer_temperature: 255
        temperature: 255
## XL
- condition: printer.base_model == "XL"
  variants:
  # XL 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 12
      pressure_advance_value: 0.18

  # XL 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 12
      pressure_advance_value: 0.1
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
      pressure_advance_value: 0.055
    variants:
    # XL HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 22
        first_layer_temperature: 250
        temperature: 250
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 14
      pressure_advance_value: 0.044
    variants:
    # XL HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 25
        first_layer_temperature: 250
        temperature: 250
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 17
      pressure_advance_value: 0.035
    variants:
    # XL HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 29
        first_layer_temperature: 250
        temperature: 250
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 22
      pressure_advance_value: 0.02
    variants:
    # XL HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 35
        first_layer_temperature: 255
        temperature: 255
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
