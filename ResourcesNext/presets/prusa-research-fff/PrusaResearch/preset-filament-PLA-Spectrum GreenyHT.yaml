kind: filament
id: Spectrum GreenyHT
inherits:
- '*PLA*'
- '*sheets_PLA_GreenyHT*'
- '*GreenyHT_MAXVOLSPEED*'
name: Spectrum GreenyHT
values:
  filament_vendor: Spectrum
  disable_fan_first_layers: 3
  min_fan_speed: 30
  bridge_fan_speed: 50
  fan_below_layer_time: 20
  filament_density: 1.54
  first_layer_temperature: 205
  temperature: 205
variants:
 ## C1
- condition: printer.base_model == "COREONE"
  id: 1cf60398-cc62-445a-8160-c74993409678
  values:
    min_fan_speed: 25
    max_fan_speed: 80
    bridge_fan_speed: 45
    overhang_fan_speed_0: 80
    first_layer_temperature: 215
    temperature: 215
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: c39b67e3-6fed-487a-8a28-d88479098836
  values:
    min_fan_speed: 25
    max_fan_speed: 80
    bridge_fan_speed: 45
    overhang_fan_speed_0: 80
    first_layer_temperature: 215
    temperature: 215
## MK3.5
- condition: printer.base_model == "MK3.5"
  id: 3143e1aa-bfb9-4d9f-95f4-d3fa8451ba66
  values:
    first_layer_temperature: 210
    temperature: 210
## MINI
- condition: printer.base_model == "MINI"
  id: 9cf3f794-a002-4ac8-a79b-785c9a5aeb97
  values:
    first_layer_temperature: 210
    temperature: 210
---
kind: filament
id: '*sheets_PLA_GreenyHT*'
variants:
# STANDARD sheet
- condition: sheet.type != "cold"
  id: 5481f570-d138-4db1-9e38-2697d24e13ba
  values:
    first_layer_bed_temperature: 45
    bed_temperature: 45
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 60
      # bed_temperature: 60
# COLD sheet
- condition: sheet.type == "cold"
  id: d1f3d94b-ecda-4853-ac10-b54c67797e20
  values:
    first_layer_bed_temperature: 30
    bed_temperature: 30
