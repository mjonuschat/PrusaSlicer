kind: filament
id: Spectrum GreenyHT
inherits:
- '*PLA*'
- '*sheets_PLA_GreenyHT*'
- '*GreenyHT_MAXVOLSPEED*'   
name: Spectrum GreenyHT
values:
  filament_vendor: Spectrum
  disable_fan_first_layers: 3
  min_fan_speed: 30
  bridge_fan_speed: 50
  fan_below_layer_time: 20
  filament_density: 1.54
  first_layer_temperature: 205
  temperature: 205
variants:
 ## C1
- condition: printer.base_model == "COREONE"
  values:
    min_fan_speed: 25
    max_fan_speed: 80
    bridge_fan_speed: 45
    overgang_fan_speed_0: 80
    first_layer_temperature: 215
    temperature: 215
## MK4S
- condition: printer.model == "MK4S"
  values:
    min_fan_speed: 25
    max_fan_speed: 80
    bridge_fan_speed: 45
    overgang_fan_speed_0: 80
    first_layer_temperature: 215
    temperature: 215
## MK3.5
- condition: printer.base_model == "MK3.5"
  values:
    first_layer_temperature: 210
    temperature: 210
## MINI
- condition: printer.base_model == "MINI"
  values:
    first_layer_temperature: 210
    temperature: 210
---        
kind: filament
id: '*sheets_PLA_GreenyHT*'      
variants:        
# STANDARD sheet
- condition: sheet.type != "cold"        
  values:
    first_layer_bed_temperature: 45
    bed_temperature: 45
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 60
      # bed_temperature: 60
# COLD sheet
- condition: sheet.type == "cold"
  values:
    first_layer_bed_temperature: 30
    bed_temperature: 30
---        
kind: filament
# Maximum volumetric speed limits
id: '*GreenyHT_MAXVOLSPEED*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 8
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 8
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 8
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 10
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 10
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 10
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 10
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 14
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 14
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 8
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 10
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 14
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
