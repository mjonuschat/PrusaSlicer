kind: filament
id: Prusament PETG Magnetite 40%
inherits:
- '*PETCF*'
- '*sheet_PET_magnetite*'
- '*magnetite_MAXVOLSPEED*'
name: Prusament PETG Magnetite 40%
values:
  filament_vendor: Prusa Polymers
  # first_layer_bed_temperature: 100
  # bed_temperature: 100
  first_layer_temperature: 265
  temperature: 270
  extrusion_multiplier: 1.09
  filament_cost: 49.99
  filament_density: 1.82
  bridge_fan_speed: 20
  min_fan_speed: 10
  max_fan_speed: 20
  fan_always_on: false
  filament_infill_max_crossing_speed: 150
---
kind: filament
id: '*sheet_PET_magnetite*'
variants:
# STANDARD sheet
- condition: sheet.type != "cold"
  id: 1578dca2-f83f-4991-ad7a-b63972737b77
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
  variants:
  - condition: printer.base_model=="XL"
    id: 5ed8171f-a6d9-467c-b6bb-205bac09610c
    values:
      first_layer_bed_temperature: 90
      bed_temperature: 90
# COLD sheet
- condition: sheet.type == "cold"
  id: 8c01cd59-ea4e-4bfb-ad64-dbf02c02da2c
  values:
    first_layer_bed_temperature: 75
    bed_temperature: 75
---
kind: filament
# Maximum volumetric speed limits
