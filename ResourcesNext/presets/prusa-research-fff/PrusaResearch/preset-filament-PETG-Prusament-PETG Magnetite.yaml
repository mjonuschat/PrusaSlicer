kind: filament
id: 'Prusament PETG Magnetite 40%'
inherits:
- '*PETCF*'
- '*sheet_PET_magnetite*'
- '*magnetite_MAXVOLSPEED*'      
name: 'Prusament PETG Magnetite 40%'
values:
  filament_vendor: Prusa Polymers
  # first_layer_bed_temperature: 100
  # bed_temperature: 100
  first_layer_temperature: 265
  temperature: 270
  extrusion_multiplier: 1.09
  filament_cost: 49.99
  filament_density: 1.82
  bridge_fan_speed: 20
  min_fan_speed: 10
  max_fan_speed: 20
  fan_always_on: false
  filament_infill_max_crossing_speed: 150
---
kind: filament
id: '*sheet_PET_magnetite*'      
variants:        
# STANDARD sheet
- condition: sheet.type != "cold"        
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
  variants:
  - condition: printer.base_model=="XL"
    values:
      first_layer_bed_temperature: 90
      bed_temperature: 90
# COLD sheet
- condition: sheet.type == "cold"
  values:
    first_layer_bed_temperature: 75
    bed_temperature: 75
---        
kind: filament
# Maximum volumetric speed limits
id: '*magnetite_MAXVOLSPEED*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 14
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 21
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 14
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 14
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 16
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 16
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 18
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 18
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 15