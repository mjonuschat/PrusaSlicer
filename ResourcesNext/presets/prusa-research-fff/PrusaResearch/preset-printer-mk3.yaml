id: 3cdf7725-8849-4a1e-adf7-f0071dbedb8d
kind: printer
inherits:
- '*MK3_nozzle_variant*'
variants:
- condition: printer.base_model == "MK3"
  id: c4c0d35c-cf8c-49ae-9f9c-bdea075b3704
  values:
    bed_shape:
    - '0x0'
    - 250x0
    - 250x210
    - '0x210'
    before_layer_gcode: |+
      ;BEFORE_LAYER_CHANGE
      G92 E0.0
      ;[layer_z]

    binary_gcode: 0
    end_gcode: |-
      {if layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+1, max_print_height)} F720 ; Move print head up{endif}
      G1 X0 Y200 F3600 ; park
      {if layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+49, max_print_height)} F720 ; Move print head further up{endif}
      G4 ; wait
      M221 S100 ; reset flow
      M900 K0 ; reset LA
      {if print_settings_id=~/.*(DETAIL @MK3|QUALITY @MK3|@0.25 nozzle MK3).*/}M907 E538 ; reset extruder motor current{endif}
      M104 S0 ; turn off temperature
      M140 S0 ; turn off heatbed
      M107 ; turn off fan
      M84 ; disable motors
      ; max_layer_z = [max_layer_z]
    extruder_offset: ['0x0']
    gcode_flavor: marlin
    high_current_on_filament_swap: 0
    layer_gcode: ";AFTER_LAYER_CHANGE\n;[layer_z]"
    machine_limits_usage: emit_to_gcode
    machine_max_acceleration_e: [5000.0, 5000.0]
    machine_max_acceleration_extruding: [1250.0, 1250.0]
    machine_max_acceleration_retracting: [1250.0, 1250.0]
    machine_max_acceleration_travel: [1500.0, 1250.0]
    machine_max_acceleration_x: [1000.0, 960.0]
    machine_max_acceleration_y: [1000.0, 960.0]
    machine_max_acceleration_z: [200.0, 200.0]
    machine_max_feedrate_e: [120.0, 120.0]
    machine_max_feedrate_x: [200.0, 100.0]
    machine_max_feedrate_y: [200.0, 100.0]
    machine_max_feedrate_z: [12.0, 12.0]
    machine_max_jerk_e: [4.5, 4.5]
    machine_max_jerk_x: [8.0, 8.0]
    machine_max_jerk_y: [8.0, 8.0]
    machine_max_jerk_z: [0.4, 0.4]
    machine_min_extruding_rate: [0.0, 0.0]
    machine_min_travel_rate: [0.0, 0.0]
    max_print_height: 210
    printer_technology: FFF
    remaining_times: 1
    silent_mode: 1
    single_extruder_multi_material: 0
    thumbnails: [160x120/PNG]
    use_firmware_retraction: 0
    use_relative_e_distances: 1
    use_volumetric_e: 0
    variable_layer_height: 1
    z_offset: 0
    cooling_tube_retraction: '40'
    cooling_tube_length: '20'
    parking_pos_retraction: '85'
    extra_loading_move: '-25'
    multimaterial_purging: '140'
  variants:
  - condition: printer.model == "MK3S"
    id: c1750310-813b-4941-8926-2f5646885eb2
    name: Original Prusa i3 MK3S & MK3S+
    variants:
    - condition: feeder.base_model=~/(MMU2|MMU3)/
      id: e5e8884c-1cc3-4085-9bc7-de91a746f375
      values:
        single_extruder_multi_material: 1
        start_gcode: |-
          M862.3 P "[printer_model]" ; printer model check
          M862.1 P[nozzle_diameter] ; nozzle diameter check
          M115 U3.14.1 ; tell printer latest fw version
          G90 ; use absolute coordinates
          M83 ; extruder relative mode
          M104 S[first_layer_temperature] ; set extruder temp
          M140 S[first_layer_bed_temperature] ; set bed temp
          M190 S[first_layer_bed_temperature] ; wait for bed temp
          M109 S[first_layer_temperature] ; wait for extruder temp
          G28 W ; home all without mesh bed level
          G80 X{first_layer_print_min[0]} Y{first_layer_print_min[1]} W{(first_layer_print_max[0]) - (first_layer_print_min[0])} H{(first_layer_print_max[1]) - (first_layer_print_min[1])} ; mesh bed levelling

          ; Send the filament type to the MMU unit.
          ; E stands for extruder number, F stands for filament type (0: default; 1:flex; 2: PVA)
          M403 E0 F{"" + ((filament_type[0]=="FLEX") ? 1 : ((filament_type[0]=="PVA") ? 2 : 0))}
          M403 E1 F{"" + ((filament_type[1]=="FLEX") ? 1 : ((filament_type[1]=="PVA") ? 2 : 0))}
          M403 E2 F{"" + ((filament_type[2]=="FLEX") ? 1 : ((filament_type[2]=="PVA") ? 2 : 0))}
          M403 E3 F{"" + ((filament_type[3]=="FLEX") ? 1 : ((filament_type[3]=="PVA") ? 2 : 0))}
          M403 E4 F{"" + ((filament_type[4]=="FLEX") ? 1 : ((filament_type[4]=="PVA") ? 2 : 0))}

          {if not has_single_extruder_multi_material_priming}
          ;go outside print area
          G1 Y-3 F1000
          G1 Z0.4 F1000
          ; select extruder
          T[initial_tool]
          ; initial load
          G1 X55 E29 F1073
          G1 X5 E29 F1800
          G1 X55 E8 F2000
          G1 Z0.3 F1000
          G92 E0
          G1 X240 E25 F2200
          G1 Y-2 F1000
          G1 X55 E25 F1400
          G1 Z0.2 F1000
          G1 X5 E4 F1000
          G92 E0
          {endif}

          M221 S{if layer_height<0.075}100{else}95{endif}
          G92 E0

          ; Don't change E values below. Excessive value can damage the printer.
          {if print_settings_id=~/.*(DETAIL @MK3|QUALITY @MK3|SOLUBLE).*/}M907 E430 ; set extruder motor current{endif}
          {if print_settings_id=~/.*(SPEED @MK3|DRAFT @MK3).*/}M907 E538 ; set extruder motor current{endif}
        end_gcode: |-
          {if layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+1, max_print_height)} F720 ; Move print head up{endif}
          M104 S0 ; turn off temperature
          M140 S0 ; turn off heatbed
          M107 ; turn off fan
          G1 X241 Y170 F3600 ; park
          {if layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+23, max_print_height)} F300 ; Move print head up{endif}
          M702 ; unload the current filament
          G4 ; wait
          M572 S0 ; reset PA
          M593 X T2 F0 ; disable IS
          M593 Y T2 F0 ; disable IS
          M84 X Y E ; disable motors
          ; max_layer_z = [max_layer_z]
    - id: 16a3955f-8b01-4ce3-a453-13c8996ffab8
      values: {}
  - condition: printer.model == "MK3"
    id: 3b2a60f8-f411-4bab-9319-8757aa0a6406
    name: Original Prusa i3 MK3
---
kind: printer
id: '*MK3_nozzle_variant*'
variants:
- condition: printer.base_model == "MK3"
  id: 5b81e35f-2c1b-4cfa-80d0-cead0b402408
  values:
    start_gcode: |-
      M862.3 P "[printer_model]" ; printer model check
      M862.1 P[nozzle_diameter] ; nozzle diameter check
      M115 U3.14.1 ; tell printer latest fw version
      G90 ; use absolute coordinates
      M83 ; extruder relative mode
      M104 S[first_layer_temperature] ; set extruder temp
      M140 S[first_layer_bed_temperature] ; set bed temp
      M190 S[first_layer_bed_temperature] ; wait for bed temp
      M109 S[first_layer_temperature] ; wait for extruder temp
      G28 W ; home all without mesh bed level
      G80 X{first_layer_print_min[0]} Y{first_layer_print_min[1]} W{(first_layer_print_max[0]) - (first_layer_print_min[0])} H{(first_layer_print_max[1]) - (first_layer_print_min[1])} ; mesh bed levelling
      {if filament_settings_id[initial_tool]=~/.*Prusament PA11.*/}
      G1 Z0.3 F720
      G1 Y-3 F1000 ; go outside print area
      G92 E0
      G1 X60 E9 F1000 ; intro line
      G1 X100 E9 F1000 ; intro line
      {else}
      G1 Z0.2 F720
      G1 Y-3 F1000 ; go outside print area
      G92 E0
      G1 X60 E9 F1000 ; intro line
      G1 X100 E12.5 F1000 ; intro line
      {endif}
      G92 E0
      M221 S{if layer_height<0.075}100{else}95{endif}
  variants:
# 0.25 nozzle
  - condition: tool.nozzle_diameter == 0.25
    id: ca12d4d4-9d98-4131-ab03-e047bf72c35f
    values:
      start_gcode: |-
        M862.3 P "[printer_model]" ; printer model check
        M862.1 P[nozzle_diameter] ; nozzle diameter check
        M115 U3.14.1 ; tell printer latest fw version
        G90 ; use absolute coordinates
        M83 ; extruder relative mode
        M104 S[first_layer_temperature] ; set extruder temp
        M140 S[first_layer_bed_temperature] ; set bed temp
        M190 S[first_layer_bed_temperature] ; wait for bed temp
        M109 S[first_layer_temperature] ; wait for extruder temp
        G28 W ; home all without mesh bed level
        G80 X{first_layer_print_min[0]} Y{first_layer_print_min[1]} W{(first_layer_print_max[0]) - (first_layer_print_min[0])} H{(first_layer_print_max[1]) - (first_layer_print_min[1])} ; mesh bed levelling
        G1 Z0.2 F720
        G1 Y-3 F1000 ; go outside print area
        G92 E0
        G1 X60 E8 F700 ; intro line
        G1 X100 E12.5 F700 ; intro line
        G92 E0
        M221 S{if layer_height<0.075}100{else}95{endif}

        ; Don't change E value below. Excessive value can damage the printer.
        {if print_settings_id=~/.*@0.25 nozzle MK3.*/}M907 E430 ; set extruder motor current{endif}
      color_change_gcode: "M600\nG1 E0.3 F1500 ; prime after color change"
# 0.4 nozzle
  - condition: tool.nozzle_diameter == 0.4
    id: 18261556-bd4e-4149-81d6-a6043a6173e9
    values:
      start_gcode: |-
        M862.3 P "[printer_model]" ; printer model check
        M862.1 P[nozzle_diameter] ; nozzle diameter check
        M115 U3.14.1 ; tell printer latest fw version
        G90 ; use absolute coordinates
        M83 ; extruder relative mode
        M104 S[first_layer_temperature] ; set extruder temp
        M140 S[first_layer_bed_temperature] ; set bed temp
        M190 S[first_layer_bed_temperature] ; wait for bed temp
        M109 S[first_layer_temperature] ; wait for extruder temp
        G28 W ; home all without mesh bed level
        G80 X{first_layer_print_min[0]} Y{first_layer_print_min[1]} W{(first_layer_print_max[0]) - (first_layer_print_min[0])} H{(first_layer_print_max[1]) - (first_layer_print_min[1])} ; mesh bed levelling
        {if filament_settings_id[initial_tool]=~/.*Prusament PA11.*/}
        G1 Z0.3 F720
        G1 Y-3 F1000 ; go outside print area
        G92 E0
        G1 X60 E9 F1000 ; intro line
        G1 X100 E9 F1000 ; intro line
        {else}
        G1 Z0.2 F720
        G1 Y-3 F1000 ; go outside print area
        G92 E0
        G1 X60 E9 F1000 ; intro line
        G1 X100 E12.5 F1000 ; intro line
        {endif}
        G92 E0
        M221 S{if layer_height<0.075}100{else}95{endif}

        ; Don't change E values below. Excessive value can damage the printer.
        {if print_settings_id=~/.*(DETAIL @MK3|QUALITY @MK3).*/}M907 E430 ; set extruder motor current{endif}
        {if print_settings_id=~/.*(SPEED @MK3|DRAFT @MK3).*/}M907 E538 ; set extruder motor current{endif}
      color_change_gcode: "M600\nG1 E0.3 F1500 ; prime after color change"
# 0.6 nozzle
  - condition: tool.nozzle_diameter == 0.6
    id: 68300f1b-1c54-40b8-8279-6914e11da0c1
    values:
      color_change_gcode: "M600\nG1 E0.4 F1500 ; prime after color change"
# 0.8 nozzle
  - condition: tool.nozzle_diameter == 0.8
    id: bc2e25f9-c6f2-44e6-bd53-c279c8f05c9d
    values:
      color_change_gcode: "M600\nG1 E0.5 F1500 ; prime after color change"
