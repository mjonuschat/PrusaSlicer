kind: filament
id: Spectrum PETG Matt
inherits:
- '*PET*'
- '*Spectrum_PETGMatt_MAXVOLSPEED*'  
name: Spectrum PETG Matt
values:
  filament_vendor: Spectrum
  extrusion_multiplier: 1.1
  filament_density: 1.35
  first_layer_temperature: 240
  temperature: 240
  full_fan_speed_layer: 1
  min_fan_speed: 15
  max_fan_speed: 100
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    idle_temperature: 130
    min_fan_speed: 25
    max_fan_speed: 70
    overhang_fan_speed_0: 70
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 255
        temperature: 255
## XL
- condition: printer.base_model == "XL"
  values:
    first_layer_bed_temperature: 80
    bed_temperature: 80
    idle_temperature: 70
    min_print_speed: 15
  variants:
  # XL 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      temperature: 245
  # XL 0.3
  - condition: tool.nozzle_diameter == 0.3
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    variants:
    # XL HF0.4
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    variants:
    # XL HF0.5
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    variants:
    # XL HF0.6
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    variants:
    # XL HF0.8
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 255
        temperature: 255
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  values:
    idle_temperature: 130
  variants:
  # MK4 0.25
  - condition: tool.nozzle_diameter == 0.25
  # MK4 0.3
  - condition: tool.nozzle_diameter == 0.3
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    variants:
    # MK4 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 14
    variants:
    # MK4 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    variants:
    # MK4 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    variants:
    # MK4 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 255
        temperature: 255
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  values:
    idle_temperature: 70
    max_fan_speed: 70
    min_fan_speed: 25
    overhang_fan_speed_0: 70
  variants:
  # MK4S 0.25
  - condition: tool.nozzle_diameter == 0.25
  # MK4S 0.3
  - condition: tool.nozzle_diameter == 0.3
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    variants:
    # MK4S HF0.4
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    variants:
    # MK4S HF0.5
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    variants:
    # MK4S HF0.6
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 250
        temperature: 250
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      max_fan_speed: 40
      bridge_fan_speed: 40
    variants:
    # MK4S HF0.8
    - condition: tool.nozzle_high_flow
      values:
        first_layer_temperature: 255
        temperature: 255
## MK3.5
- condition: printer.base_model == "MK3.5"
  values:
    min_fan_speed: 15
    max_fan_speed: 40
    bridge_fan_speed: 50
    retract_length: 1.4
  variants:
  # MK3.5 0.25
  - condition: tool.nozzle_diameter == 0.25
    variants:
    # MK3.5 0.25 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 2
  # MK3.5 0.3
  - condition: tool.nozzle_diameter == 0.3
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 15
    variants:
    # MK3.5 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 7
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    variants:
    # MK3.5 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 250
      temperature: 250
## MINI
- condition: printer.base_model == "MINI"
  values:
    min_fan_speed: 30
    max_fan_speed: 100
  variants:
  # MINI 0.25
  - condition: tool.nozzle_diameter == 0.25
  # MINI 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 10
  # MINI 0.6
  - condition: tool.nozzle_diameter == 0.6
  # MINI 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 250
      temperature: 250
## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model=~/(MK3|MK2.5)/
  values:
    min_fan_speed: 30
    max_fan_speed: 100
  variants:
  # MK3 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 10
    variants:
    # MK3 0.25 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 2
  # MK3 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 12
    variants:
    # MK3 0.4 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 7
  # MK3 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      slowdown_below_layer_time: 17
    variants:
    # MK3 0.6 MMU
    - condition: feeder.base_model == "MMU"
      values:
        temperature: 230
        filament_max_volumetric_speed: 13
  # MK3 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 250
      temperature: 250
## MK2S
- condition: printer.model == "MK2S"
  values:
    min_fan_speed: 30
    max_fan_speed: 100
    filament_max_volumetric_speed: 8
  variants:
  # MK2 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      slowdown_below_layer_time: 15
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      slowdown_below_layer_time: 15
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 15
## MK2S MMU1
- condition: printer.model == "MK2SMM"
  values:
    min_fan_speed: 30
    max_fan_speed: 100
    filament_max_volumetric_speed: 8
  variants:
  # MK2 0.25
  - condition: tool.nozzle_diameter == 0.25
  # MK2 0.4
  - condition: tool.nozzle_diameter == 0.4
  # MK2 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 12
---        
kind: filament
# Maximum volumetric speed limits
