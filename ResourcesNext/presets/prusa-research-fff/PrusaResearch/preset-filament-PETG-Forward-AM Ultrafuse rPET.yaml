kind: filament
id: Forward-AM Ultrafuse rPET
inherits:
- '*PET*'
- '*sheets_PET_UltrafuserPET*'
- '*UltrafuserPET_MAXVOLSPEED*'
name: Forward-AM Ultrafuse rPET
values:
  filament_vendor: Forward-AM
  filament_type: 'PET'
  first_layer_bed_temperature: 235
  temperature: 235
  bridge_fan_speed: 100
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 50
  max_fan_speed: 100
  fan_below_layer_time: 15
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  values:
    bridge_fan_speed: 80
    min_fan_speed: 40
    max_fan_speed: 75
    overhang_fan_speed_0: 75
---        
kind: filament
id: '*sheets_PET_UltrafuserPET*' 
variants:        
# STANDARD sheet
- condition: sheet.type != "cold"        
  values:
    first_layer_bed_temperature: 75
    bed_temperature: 75
# COLD sheet
- condition: sheet.type == "cold"
  values:
    first_layer_bed_temperature: 60
    bed_temperature: 60
---        
kind: filament
# Maximum volumetric speed limits
id: '*UltrafuserPET_MAXVOLSPEED*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 16
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 9
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 18
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 10
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 20
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 13
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 26