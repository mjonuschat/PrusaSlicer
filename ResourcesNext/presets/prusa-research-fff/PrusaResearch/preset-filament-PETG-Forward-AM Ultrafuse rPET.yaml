  id: e42933f3-2c0c-4a2e-a31b-eecf4f8c7a3f
  values:
    first_layer_bed_temperature: 75
    bed_temperature: 75
# COLD sheet
- condition: sheet.type == "cold"
  id: 70d2e162-bcd4-4f65-b6fd-8e04b3c11380
  values:
    first_layer_bed_temperature: 60
    bed_temperature: 60
