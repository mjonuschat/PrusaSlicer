kind: filament
id: addnorth Rigid X
inherits:
- '*PETCF*'
- '*RigidX_MAXVOLSPEED*'
name: addnorth Rigid X
values:
  filament_vendor: addnorth
  extrusion_multiplier: 0.98
  filament_cost: 29.99
  filament_spool_weight: 162
  first_layer_temperature: 250
  temperature: 260
  bridge_fan_speed: 70
  full_fan_speed_layer: 0
  min_fan_speed: 20
  max_fan_speed: 60
  min_print_speed: 20
variants:
  - condition: printer.model=~/(COREONE|MK4S)/
    values:
      min_fan_speed: 14
      max_fan_speed: 40
      bridge_fan_speed: 50
      overhang_fan_speed_0: 40
---        
kind: filament
# Maximum volumetric speed limits
id: '*RigidX_MAXVOLSPEED*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 11
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 11
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 11
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 20
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 14
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 24
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 17
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 28
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 22
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 35