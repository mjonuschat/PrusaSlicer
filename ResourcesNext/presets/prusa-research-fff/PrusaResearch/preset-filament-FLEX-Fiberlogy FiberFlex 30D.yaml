kind: filament
id: Fiberlogy FiberFlex 30D
inherits:
- '*FLEX*'
name: Fiberlogy FiberFlex 30D
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: Fiberlogy
  first_layer_temperature: 220
  temperature: 220
  first_layer_bed_temperature: 55
  bed_temperature: 55
  filament_cost: 39.41
  disable_fan_first_layers: 5
  full_fan_speed_layer: 5
  extrusion_multiplier: 1.1
  filament_density: 1.07
  filament_spool_weight: 330
  bridge_fan_speed: 75
  min_fan_speed: 25
  retract_length: 3
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 70015734-6798-4892-9a83-a14b72638956
  values:
    bridge_fan_speed: 50
    min_fan_speed: 20
    max_fan_speed: 45
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 9a4f133d-401a-42ff-ad69-60d5124131fd
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 8fa613b8-e321-4e40-8fac-09ef0ee294ff
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: ad66f9d5-d69c-474a-9cd8-40dc5f6742d0
    values:
      filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 9e7bc9ec-ede0-4dcb-b71a-c23f6c8d93fa
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  id: 4fef7059-bf65-44d6-80a2-20db983f8e8d
  values:
    retract_length_toolchange: 3
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 6c213f78-b1c1-4800-a3d1-be30c1c444e6
    values:
      filament_max_volumetric_speed: 2.5
      filament_multitool_ramming_flow: 2.5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: a36f041b-bec7-481b-a5f0-3c22901b1896
    values:
      filament_max_volumetric_speed: 2.5
      filament_multitool_ramming_flow: 2.5
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: f92aadc5-7cc0-44f8-a491-3d224dc29026
    values:
      filament_max_volumetric_speed: 5
      filament_multitool_ramming_flow: 5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: e67084cc-a64c-444f-90b4-497c4ae290e5
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: 30d8e720-e2c8-4e64-a584-93eb6bf37934
