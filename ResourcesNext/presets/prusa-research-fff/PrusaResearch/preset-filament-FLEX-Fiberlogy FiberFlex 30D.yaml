  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 2391485f-8a78-48cd-8be1-f7ee8ae75d3c
    values:
      filament_max_volumetric_speed: 1.2
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 52107850-ebff-4b4e-87dd-66dcbaa1ff94
