kind: filament
id: Fiberlogy PLA Mineral
inherits:
- '*PLA*'
- '*FiberlogyMineral_MAXVOLSPEED*'
name: Fiberlogy PLA Mineral
values:
  filament_vendor: Fiberlogy
  extrusion_multiplier: 0.98
  filament_cost: 37.64
  filament_density: 1.38
  first_layer_temperature: 195
  temperature: 190
  filament_spool_weight: 330
variants:
 ## C1
- condition: printer.base_model == "COREONE"
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
## MK4S
- condition: printer.model == "MK4S"
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
## MINI
- condition: printer.base_model == "MINI"
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model == "MK3"
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
---        
kind: filament
# Maximum volumetric speed limits
id: '*FiberlogyMineral_MAXVOLSPEED*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 10
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 10
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 10
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 10
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 11
