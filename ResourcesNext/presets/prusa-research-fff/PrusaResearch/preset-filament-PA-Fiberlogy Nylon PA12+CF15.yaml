kind: filament
id: Fiberlogy Nylon PA12+CF15
inherits:
- '*PACF*'
- '*sheets_PACF_fiberlogypacf*'
- '*fiberlogypacf_MAXVOLSPEED_PACF*'
name: Fiberlogy Nylon PA12+CF15
# No MINI
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Fiberlogy
  first_layer_temperature: 265
  temperature: 265
  extrusion_multiplier: 0.97
  filament_cost: 87.5
  filament_density: 1.07
  filament_spool_weight: 330
  min_fan_speed: 10
  max_fan_speed: 15
  disable_fan_first_layers: 5
  fan_below_layer_time: 20
---
kind: filament
id: '*sheets_PACF_fiberlogypacf*'
variants:
# STANDARD sheet
- condition: sheet.type != "PA"
  id: 3a4202ca-d8e7-4e4b-97b0-f1b4b57b35db
  values:
    first_layer_bed_temperature: 105
    bed_temperature: 110
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
# PA sheet
- condition: sheet.type == "PA"
  id: e2830143-4d75-4d15-b4d1-2348fc99fff1
  values:
    first_layer_bed_temperature: 90
    bed_temperature: 110
---
