kind: filament
id: eSun PLA
inherits:
- '*PLA*'
name: eSun PLA
values:
  filament_cost: '10'
  filament_vendor: eSun
  filament_spool_weight: 265
variants:
  ## C1
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    name: 'eSun PLA @COREONE 0.25'
    values:
      pressure_advance_value: 0.1
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    name: 'eSun PLA @COREONE 0.3'
    values:
      pressure_advance_value: 0.07
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: 'eSun PLA @COREONE 0.4'
    values:
      pressure_advance_value: 0.03
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: 'eSun PLA @COREONE HF0.4'
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    name: 'eSun PLA @COREONE 0.5'
    values:
      pressure_advance_value: 0.021
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      name: 'eSun PLA @COREONE HF0.5'
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
