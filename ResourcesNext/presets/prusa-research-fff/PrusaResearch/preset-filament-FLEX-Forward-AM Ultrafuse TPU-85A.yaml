kind: filament
id: Forward AM Ultrafuse TPU-85A
inherits:
- '*FLEX*'
name: Forward AM Ultrafuse TPU-85A
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: Forward AM
  first_layer_temperature: 220
  temperature: 215
  extrusion_multiplier: 1.1
  filament_density: 1.11
  fan_below_layer_time: 30
  slowdown_below_layer_time: 15
  filament_spool_weight: 0
  min_fan_speed: 20
  max_fan_speed: 100
  retract_length: 3.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 6ba15d66-0175-41f7-aa69-29ff11f51f91
  values:
    min_fan_speed: 20
    max_fan_speed: 80
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: b8115735-a7ad-44bc-9cd7-904332e20d7a
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: c4484f33-6859-41d9-b3e7-bbee367e2299
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 0483f727-83d5-4f59-8337-176d1e069e00
    values:
      filament_max_volumetric_speed: 4
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: f0a26eaa-b934-4147-b042-0c20f6a148f4
    values:
      filament_max_volumetric_speed: 7
## XL
- condition: printer.base_model == "XL"
  id: ab1bf682-aa27-4c54-88a3-376ac3f51259
  values:
    retract_length_toolchange: 3.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: a798045d-3000-4b3f-9ac5-e4c4e1da82b6
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: f3820c83-fd59-4973-a866-ac719574dc5f
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 755f9ba7-0e05-4c55-8b63-a74df646d3e6
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 59b81f12-0a0b-4db5-adfa-150ac4a16b8d
    values:
      filament_max_volumetric_speed: 7
      filament_multitool_ramming_flow: 7
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: 9d19cab1-44b9-47f3-814a-d8549272be16
