kind: filament
id: Extrudr GreenTEC Pro Carbon
inherits:
- '*PLA*'
name: Extrudr GreenTEC Pro Carbon
condition: tool.nozzle_diameter >= 0.4
values:
  filament_vendor: Extrudr
  min_fan_speed: 30
  max_fan_speed: 80
  filament_cost: 62.49
  filament_density: 1.2
  filament_spool_weight: 230
  filament_abrasive: true
variants:
 ## C1
- condition: printer.base_model == "COREONE"
  values:
    min_fan_speed: 25
    max_fan_speed: 60
    bridge_fan_speed: 100
    overhang_fan_speed_0: 80
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  values:
    min_fan_speed: 25
    max_fan_speed: 60
    bridge_fan_speed: 100
    overhang_fan_speed_0: 80