kind: filament
id: ROSA3D PETG Standard
inherits:
- '*PET*'
name: ROSA3D PETG Standard
values:
  filament_vendor: ROSA3D
  filament_density: 1.29
  first_layer_temperature: 235
  temperature: 235
  filament_cost: 89.9
## C1
variants:
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 12
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 12
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 12
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 21
        first_layer_temperature: 245
        temperature: 245
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 14
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 24
        first_layer_temperature: 245
        temperature: 245
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 17
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 27
        first_layer_temperature: 245
        temperature: 245
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 22
      slowdown_below_layer_time: 20
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 34
        first_layer_temperature: 245
        temperature: 245
