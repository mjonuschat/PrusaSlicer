kind: filament
id: Fiberthree F3 PA-CF Pro
inherits:
- '*PACF*'
- '*f3pacf_MAXVOLSPEED_PACF*'
name: Fiberthree F3 PA-CF Pro
# No MINI
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Fiberthree
  first_layer_temperature: 285
  temperature: 285
  extrusion_multiplier: 1
  filament_cost: 208.1
  filament_density: 1.25
  filament_spool_weight: 0
  min_fan_speed: 0
  max_fan_speed: 0
  fan_below_layer_time: 20
  # Bed temperature global
  first_layer_bed_temperature: 90
  bed_temperature: 90
variants:
- condition: printer.base_model=~/(MK2|MK3|MK3.5)/
  id: c4ecaf65-77de-48b0-aa65-351b8bd67eca
  values:
    retract_length: 2
    retract_speed: 40
    wipe: false
---
