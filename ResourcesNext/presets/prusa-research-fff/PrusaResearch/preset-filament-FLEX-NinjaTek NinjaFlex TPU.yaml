kind: filament
id: Ninjatek NinjaFlex TPU
inherits:
- '*FLEX*'
name: Ninjatek NinjaFlex TPU
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: NinjaTek
  first_layer_temperature: 238
  temperature: 238
  filament_density: 1.19
  bridge_fan_speed: 75
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 60
  min_print_speed: 10
  extrusion_multiplier: 1.12
  filament_cost: 85
  retract_length: 3.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: d479ddb1-b0c7-4c87-822c-2bc1935e6b1a
  values:
    bridge_fan_speed: 60
    min_fan_speed: 40
    max_fan_speed: 50
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 1c852184-fa0f-4ef6-b605-d2ab6a44bbe0
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 9c050403-f921-41db-b142-931ecc48317b
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 330c2ee8-44b4-4498-a4c1-6d98f3a4237a
    values:
      filament_max_volumetric_speed: 4
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 09322bed-20c8-49c8-81a6-8f1c24e16651
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  id: 48e7552a-8c99-4605-8e0c-3ba434cc3d1e
  values:
    retract_length_toolchange: 3.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 0fdcee48-8767-48a0-b49d-c17e5b0cdfc0
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: fd94a50c-52ed-4a9a-af4c-bdd2c32f4396
    values:
      filament_max_volumetric_speed: 3
      filament_multitool_ramming_flow: 3
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: f5960978-b268-404b-a451-15eed82f0474
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 7889d5e9-9256-426b-9256-53ff06ed8315
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: 9d5944b3-55be-4a34-928a-7465f6f60d06
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 743fe94c-6556-41a4-a4c1-8f78fb60c2b1
    values:
      filament_max_volumetric_speed: 3.5
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 331d6a7c-a63f-459b-9872-9d4e5aa0bd2a
    values:
      filament_max_volumetric_speed: 3.5
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 5ac8e19d-1426-412f-938d-1115dbd79d95
    values:
      filament_max_volumetric_speed: 6
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 3fc74836-f444-42f8-b13a-e3291cc975c4
    values:
      filament_max_volumetric_speed: 10
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: b438f375-cb83-4ed2-a690-d6c53ef55e33
  values:
    bridge_fan_speed: 60
    min_fan_speed: 40
    max_fan_speed: 60
  variants:
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: afb14012-c3e8-4997-892b-981bfa772ce5
    values:
      filament_max_volumetric_speed: 3.5
  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: fbbe1c4c-60ec-4fa5-be7d-debc457451de
    values:
      filament_max_volumetric_speed: 3.5
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 7e3e21db-e964-4520-aaf4-ee3fc0d74cf0
    values:
      filament_max_volumetric_speed: 6
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: dd4a59b0-88ab-455b-841d-565225221b92
    values:
      filament_max_volumetric_speed: 10
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  id: 49b0ab95-fdc8-4df0-8e89-eefe51e16ff5
  values:
    extrusion_multiplier: 1.2
    idle_temperature: 70
    deretract_speed: 25
    retract_length: 2.5
    retract_speed: 60
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 1.2
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 2ed7b718-ffbf-4a98-8e14-4efa346a4dad
    values:
      filament_max_volumetric_speed: 1.2
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 74f36d18-3a94-426b-8ba8-cca0582e70fe
    values:
      filament_max_volumetric_speed: 1.2
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 3358e265-0c33-404e-88dd-c3eceba7f5a2
    values:
      filament_max_volumetric_speed: 1.5
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 2e1d8fc1-d571-474c-952f-1d15c335a2a0
