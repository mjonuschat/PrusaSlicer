kind: filament
id: 'Elegoo Rapid PLA+'
inherits:
- '*PLA*'
name: 'Elegoo Rapid PLA+'
values:
  filament_cost: '22'
  filament_vendor: Elegoo
  filament_density: 1.23
  filament_spool_weight: 160
  filament_infill_max_speed: 0
  filament_infill_max_crossing_speed: 0
variants:
  ## C1
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.09
  # C1 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.06
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.027
      slowdown_below_layer_time: 6
      filament_max_volumetric_speed: 17
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      values:
        slowdown_below_layer_time: 6
        filament_max_volumetric_speed: 25
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.019
      filament_max_volumetric_speed: 17
    variants:
    # C1 HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 26
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.016
      filament_max_volumetric_speed: 18
    variants:
    # C1 HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 32
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.011
      filament_max_volumetric_speed: 20
    variants:
    # C1 HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 37
