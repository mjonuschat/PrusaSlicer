kind: filament
id: 'Sunlu PLA+ 2.0'
inherits:
- '*PLA*'
- '*SunluPLA20_P_ADVANCE*' 
- '*SunluPLA20_MAXVOLSPEED*' 
name: 'Sunlu PLA+ 2.0'
values:
  filament_vendor: Sunlu
  filament_cost: 22
  filament_density: 1.23
  filament_spool_weight: 162
  filament_infill_max_speed: 0
  filament_infill_max_crossing_speed: 0
variants:
- condition: printer.base_model=~/(MINI|MK3.5)/
  values:
    first_layer_temperature: 230
    temperature: 220
---        
kind: filament
# Pressure advance values
id: '*SunluPLA20_P_ADVANCE*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.09
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.06
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.028
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.028
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.019
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.019
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.017
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.017
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        pressure_advance_value: 0.01
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.66
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.22
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.13
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.09
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.09
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      pressure_advance_value: 0.06
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.028
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      pressure_advance_value: 0.019
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.017
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
## MK3
- condition: printer.base_model == "MK3"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      pressure_advance_value: 0.07
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      pressure_advance_value: 0.05
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      pressure_advance_value: 0.04
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      pressure_advance_value: 0.01
## MK2
- condition: printer.base_model == "MK2"
  variants:
