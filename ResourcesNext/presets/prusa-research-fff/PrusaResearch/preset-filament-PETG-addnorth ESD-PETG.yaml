kind: filament
id: addnorth ESD-PETG
inherits:
- '*PET*'
- '*addnorthESDPETG_MAXVOLSPEED*'
- '*sheets_PET_addnorthESDPETG*'
name: addnorth ESD-PETG
values:
  filament_vendor: addnorth
  extrusion_multiplier: 0.98
  filament_cost: 29.99
  bridge_fan_speed: 35
  min_fan_speed: 15
  max_fan_speed: 30
  fan_below_layer_time: 8
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  id: d293fdc4-d97d-4dda-aaaf-51cab1f50697
  values:
    min_fan_speed: 12
    max_fan_speed: 20
    bridge_fan_speed: 25
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: a240f734-c086-4bca-99b5-cd13eaedc87e
    values:
      fan_below_layer_time: 10
      slowdown_below_layer_time: 9
      overhang_fan_speed_0: 20
  - condition: tool.nozzle_diameter == 0.5
    id: a12b9536-7c3d-42bb-99e5-301c97e3e1c4
    values:
      slowdown_below_layer_time: 11
  - condition: tool.nozzle_diameter == 0.6
    id: 898fff5b-c681-42e9-99c1-6739966a723f
    values:
      fan_below_layer_time: 18
      slowdown_below_layer_time: 14
  - condition: tool.nozzle_diameter == 0.8
    id: 2d97fffd-907a-4a83-ae96-28ee4b8d1abc
    values:
      fan_below_layer_time: 25
      slowdown_below_layer_time: 18
