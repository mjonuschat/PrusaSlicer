kind: filament
id: Overture High Speed TPU
inherits:
- '*FLEX*'
name: Overture High Speed TPU
values:
  filament_vendor: Overture
  first_layer_temperature: 240
  temperature: 235
  bridge_fan_speed: 75
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 60
  min_print_speed: 10
  extrusion_multiplier: 1.05
  filament_density: 1.19
  filament_cost: 85
  retract_length: 1.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  values:
    bridge_fan_speed: 60
    min_fan_speed: 40
    max_fan_speed: 50
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 6.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
## XL
- condition: printer.base_model == "XL"
  values:
    retract_length_toolchange: 1.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 5
      filament_multitool_ramming_flow: 5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 5
      filament_multitool_ramming_flow: 5
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 6.5
      filament_multitool_ramming_flow: 6.5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 10
      filament_multitool_ramming_flow: 10
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 6
  # MK4 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 7
  # MK4 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 8
  # MK4 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 12
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  values:
    bridge_fan_speed: 60
    min_fan_speed: 40
    max_fan_speed: 60
  variants:
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 6
  # MK4S 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 7
  # MK4S 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 8
  # MK4S 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 12
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  values:
    extrusion_multiplier: 1.05
    idle_temperature: 70
    deretract_speed: 25
    retract_length: 1.5
    retract_speed: 45
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 4
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 4
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 4
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 5
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 8
## MINI
- condition: printer.base_model == "MINI"
  values:
    extrusion_multiplier: 1.05
    retract_before_travel: 5
    retract_length: 4.5
    travel_ramping_lift: 0
    retract_lift: 0
  variants:
  # MINI 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 3.5
  # MINI 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 3.5
  # MINI 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 4.5