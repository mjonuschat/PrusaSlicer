kind: filament
id: Tectonic-3D KRATIR PA6.66 CF
inherits:
- '*PACF*'
- '*kratirpa6cf_MAXVOLSPEED_PACF*'
- '*sheets_PACF_kratirpa6cf*'
name: Tectonic-3D KRATIR PA6.66 CF
# No MINI
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: Tectonic-3D
  first_layer_temperature: 265
  temperature: 265
  extrusion_multiplier: 1
  filament_density: 1.17
  filament_spool_weight: 200
  bridge_fan_speed: 0
  min_fan_speed: 0
  max_fan_speed: 0
  fan_below_layer_time: 30
  retract_length: 1
  retract_before_travel: 2
  retract_layer_change: false
  retract_lift: 0
variants:
- condition: printer.base_model == "COREONE"
  id: c5f0e976-298e-44de-991b-2322ccdb693d
  values:
    chamber_temperature: 50
    chamber_minimal_temperature: 0
    filament_shrinkage_compensation_xy: 0%
    filament_shrinkage_compensation_z: 0.24%
---
kind: filament
id: '*sheets_PACF_kratirpa6cf*'
variants:
# STANDARD sheet
- condition: sheet.type != "PA"
  id: 5e18dfd7-125b-4a87-a0cd-45514e5bf619
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
# PA sheet
- condition: sheet.type == "PA"
  id: 780414ba-3c8a-46a2-af1b-d636dd83baf5
  values:
    first_layer_bed_temperature: 90
    bed_temperature: 100
---
