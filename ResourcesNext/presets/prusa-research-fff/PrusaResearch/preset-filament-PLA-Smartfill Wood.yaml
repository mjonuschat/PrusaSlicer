kind: filament
id: Smartfill Wood
inherits:
- '*PLAFILL*'
name: Smartfill Wood
values:
  filament_vendor: Fillamentum
  extrusion_multiplier: 1.08
  filament_cost: '68'
  filament_spool_weight: 230
  filament_density: 1.58
  first_layer_temperature: 220
  temperature: 220
variants:
  ## C1
- condition: printer.base_model == "COREONE"
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    name: 'Smartfill Wood @COREONE 0.4'
    values:
      filament_max_volumetric_speed: 11
    variants:
    # C1 HF0.4
    - condition: tool.nozzle_high_flow
      name: 'Smartfill Wood @COREONE HF0.4'
      values:
        filament_max_volumetric_speed: 11
