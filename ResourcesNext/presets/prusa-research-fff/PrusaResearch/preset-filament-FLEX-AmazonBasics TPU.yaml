kind: filament
id: AmazonBasics TPU
inherits:
- '*FLEX*'
name: AmazonBasics TPU
condition: tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  filament_vendor: AmazonBasics
  filament_cost: 19.99
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 80
  max_fan_speed: 80
  bridge_fan_speed: 100
  extrusion_multiplier: 1.1
  filament_density: 1.21
  first_layer_temperature: 235
  temperature: 235
  retract_length: 2.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 4f54e22c-528f-4797-b4b1-00677b458383
  values:
    bridge_fan_speed: 70
    min_fan_speed: 50
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: aefd19d6-6cab-4dfe-8c7f-8d100b3b61c5
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 5e174994-be8d-430f-b49b-b9c36d17b57d
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 026c5b66-959b-457b-8cde-36d83d2f333f
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 7e5a3e78-7d85-4699-9716-c2f3e9d7aff1
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.base_model == "XL"
  id: 7b343189-127d-4332-8718-7fe7ed42e1d5
