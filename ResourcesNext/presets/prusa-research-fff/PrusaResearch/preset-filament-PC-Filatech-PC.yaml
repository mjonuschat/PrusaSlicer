kind: filament
id: Filatech PC
inherits:
- '*PC*'
name: Filatech PC
values:
  filament_vendor: Filatech
  bridge_fan_speed: 25
  min_fan_speed: 15
  max_fan_speed: 15
  cooling: false
  filament_density: 1.2
  filament_spool_weight: 0
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  values:
    min_fan_speed: 12
    max_fan_speed: 12
    bridge_fan_speed: 20
  variants:
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
    variants:
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 20
- condition: printer.model=~/(MK4|XL)/
  variants:
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
    variants:
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 20
