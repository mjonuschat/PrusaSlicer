kind: filament
id: Extrudr Flax
inherits:
- '*PLA*'
- '*ExtrudrFLAX_MAXVOLSPEED*'
name: Extrudr Flax
values:
  filament_vendor: Extrudr
  disable_fan_first_layers: 3
  min_fan_speed: 30
  max_fan_speed: 80
  filament_cost: 50.91
  filament_density: 1.45
  first_layer_temperature: 190
  temperature: 190
  filament_spool_weight: 262
  full_fan_speed_layer: 0
variants:
 ## C1
- condition: printer.base_model == "COREONE"
  values:
    min_fan_speed: 30
    max_fan_speed: 60
    bridge_fan_speed: 80
    overhang_fan_speed_0: 80
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  values:
    min_fan_speed: 30
    max_fan_speed: 60
    bridge_fan_speed: 80
    overhang_fan_speed_0: 80
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
## MK3.5
- condition: printer.base_model == "MK3.5"
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
## MINI
- condition: printer.base_model == "MINI"
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
## MK3, MK3S and MK2.5, MK2.5S
- condition: printer.base_model=~/(MK3|MK2.5)/
  variants:
  - condition: tool.nozzle_diameter == 0.8
    values:
      first_layer_temperature: 200
      temperature: 200
---        
kind: filament
# Maximum volumetric speed limits
id: '*ExtrudrFLAX_MAXVOLSPEED*'      
## C1, MK4, XL family
variants:
- condition: printer.base_model=~/(COREONE|MK4|XL)/
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 11
  # 0.3
  - condition: tool.nozzle_diameter == 0.3
    values:
      filament_max_volumetric_speed: 11
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 11
    variants:
    # HF0.4
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 11
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    values:
      filament_max_volumetric_speed: 12
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 12
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    values:
      filament_max_volumetric_speed: 14
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 14
  # 0.8
  - condition: tool.nozzle_diameter == 0.8
    values:
      filament_max_volumetric_speed: 17
    variants:
    # HF0.8
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 17
## MINI
- condition: printer.base_model == "MINI"
  variants:
  # 0.25
  - condition: tool.nozzle_diameter == 0.25
    values:
      filament_max_volumetric_speed: 11
  # 0.4
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 11
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
