kind: filament
id: Forward-AM Ultrafuse PC-ABS-FR
inherits:
- '*PC*'
name: Forward-AM Ultrafuse PC-ABS-FR
values:
  filament_vendor: Forward-AM
  bed_temperature: 105
  filament_density: 1.17
  retract_layer_change: false
variants:
- condition: printer.model=~/(COREONE|MK4S)/
  values:
    max_fan_speed: 20
  variants:
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
    variants:
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 18
- condition: printer.model=~/(MK4|XL)/
  variants:
  - condition: tool.nozzle_diameter == 0.4
    values:
      filament_max_volumetric_speed: 8
    variants:
    - condition: tool.nozzle_high_flow
      values:
        filament_max_volumetric_speed: 18
- condition: printer.model == "MINI"
  values:
    bed_temperature: 100
