kind: filament
id: ColorFabb VarioShore TPU
inherits:
- '*FLEX*'
name: ColorFabb VarioShore TPU
features:
  $.type: TPU
condition: tool.nozzle_diameter == 0.4 and feeder.base_model!~/.*MMU.*/ and printer.base_model != "MINI"
values:
  filament_vendor: ColorFabb
  filament_cost: 77
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 60
  extrusion_multiplier: 0.85
  filament_density: 1.21
  first_layer_temperature: 220
  temperature: 220
  retract_length: 1.2
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 8f7527ee-bfdb-46cb-955e-bd9dc8ec6adc
  values:
    bridge_fan_speed: 70
    min_fan_speed: 45
    max_fan_speed: 45
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: be1e4c29-7f70-40e6-8e28-41d2463af634
    values:
      filament_max_volumetric_speed: 1.5
## XL
- condition: printer.base_model == "XL"
  id: 54f0979e-b0a8-418e-b426-224afa24732a
  values:
    retract_length_toolchange: 2.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 8d928b4c-1fec-4e15-be8b-1a27b14b79b5
    values:
      filament_max_volumetric_speed: 1.5
      filament_multitool_ramming_flow: 1.5
## MK4
- condition: printer.model=~/(MK4|MK3.9)/
  id: 57399801-6ea9-4c7b-9efe-fd1ed52908b3
  variants:
  # MK4 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: ea7ba50d-4215-4476-b252-aa2fa709ab01
    values:
      filament_max_volumetric_speed: 1.5
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: 2a1d14fb-d8ea-4304-93bd-0bf2ee9c0aee
  values:
    bridge_fan_speed: 70
    min_fan_speed: 45
    max_fan_speed: 45
  variants:
  # MK4S 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 4e61e8fa-3893-4006-af80-001f1f86a0c4
    values:
      filament_max_volumetric_speed: 1.5
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  id: 1c2cbb8a-9121-4bef-b4d0-c7c9ea3884c8
  values:
    extrusion_multiplier: 0.85
    idle_temperature: 70
    deretract_speed: 20
    retract_length: 1.2
    retract_speed: 45
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 1.5
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 44101189-5f8d-4a67-adc0-406ae5c42f59
    values:
      filament_max_volumetric_speed: 1.5
