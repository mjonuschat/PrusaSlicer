id: Prusament Resin Model Grass Green
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Prusa Polymers
  material_type: Model
  material_colour: '#37823F'
variants:
## SL1S
- condition: printer.model == "SL1S"
  id: e74614bd-209f-4998-af97-c8105d4a0e51
  unconditional_inherits:
  - '*sl1s_fast*'
  values:
    area_fill: 20
    delay_before_exposure: [1, 10]
    tilt_down_initial_speed: layer1750,layer1750
    tilt_down_offset_steps: [0, 1200]
    tilt_down_finish_speed: move8000,move5120
    tilt_up_initial_speed: move8000,move8000
    tilt_up_offset_steps: [600, 600]
    tilt_up_finish_speed: layer1750,layer1750
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    id: ad22d89e-a39f-4d8e-a91a-b9985bac98b4
    name: Prusament Resin Model Grass Green @SL1S 0.025
    values:
      exposure_time: 2
      initial_exposure_time: 5
# 0.05
  - condition: print.layer_height == 0.05
    id: 673e8506-4103-4f5b-8492-94fa653761c3
    name: Prusament Resin Model Grass Green @SL1S 0.05
    values:
      exposure_time: 2.2
      initial_exposure_time: 6
# 0.1
  - condition: print.layer_height == 0.1
    id: 9ccff714-a6f5-4967-84be-9857809fad0f
    name: Prusament Resin Model Grass Green @SL1S 0.1
    values:
      exposure_time: 2.9
      initial_exposure_time: 8
