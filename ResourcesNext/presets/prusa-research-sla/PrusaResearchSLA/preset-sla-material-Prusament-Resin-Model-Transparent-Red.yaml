id: Prusament Resin Model Transparent Red
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Prusa Polymers
  material_type: Model
  material_colour: '#D21B31'
variants:
## SL1S
- condition: printer.model == "SL1S"
  id: 80e4cefe-4641-4cb9-b5c6-57c323b6afca
  unconditional_inherits:
  - '*sl1s_fast*'
  values:
    area_fill: 20
    delay_before_exposure: [1, 10]
    tilt_down_initial_speed: layer1750,layer1750
    tilt_down_offset_steps: [0, 1200]
    tilt_down_finish_speed: move8000,move5120
    tilt_up_initial_speed: move8000,move8000
    tilt_up_offset_steps: [600, 600]
    tilt_up_finish_speed: layer1750,layer1750
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    id: 13499ce1-5cc8-4559-97aa-4f7f01b279c7
    name: Prusament Resin Model Transparent Red @SL1S 0.025
    values:
      exposure_time: 2.2
      initial_exposure_time: 5
# 0.05
  - condition: print.layer_height == 0.05
    id: b698581b-a9cf-4f27-82e7-608ccb1bff50
    name: Prusament Resin Model Transparent Red @SL1S 0.05
    values:
      exposure_time: 2.4
      initial_exposure_time: 6
# 0.1
  - condition: print.layer_height == 0.1
    id: 5c7729a2-5aad-4cfc-ad69-03a229337ebc
    name: Prusament Resin Model Transparent Red @SL1S 0.1
    values:
      exposure_time: 2.9
      initial_exposure_time: 8
