id: Prusament Resin Model Transparent Amber
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Prusa Polymers
  material_type: Model
  material_colour: '#FFC107'
variants:
## SL1S
- condition: printer.model == "SL1S"
  id: 0b3a616f-e49e-4a55-898b-2fc7a8705779
  unconditional_inherits:
  - '*sl1s_fast*'
  values:
    area_fill: 20
    delay_before_exposure: [1, 10]
    tilt_down_initial_speed: layer1750,layer1750
    tilt_down_offset_steps: [0, 1200]
    tilt_down_finish_speed: move8000,move5120
    tilt_up_initial_speed: move8000,move8000
    tilt_up_offset_steps: [600, 600]
    tilt_up_finish_speed: layer1750,layer1750
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    id: b2f92f49-b1ba-468c-8756-fc440382ecf3
    name: Prusament Resin Model Transparent Amber @SL1S 0.025
    values:
      exposure_time: 2
      initial_exposure_time: 5
# 0.05
  - condition: print.layer_height == 0.05
    id: 3bf2dc45-1cff-4b20-9d01-867131fb7e18
    name: Prusament Resin Model Transparent Amber @SL1S 0.05
    values:
      exposure_time: 2.4
      initial_exposure_time: 6
# 0.1
  - condition: print.layer_height == 0.1
    id: 1bf84b39-4067-44ac-8315-298ce0bb7e92
    name: Prusament Resin Model Transparent Amber @SL1S 0.1
    values:
      exposure_time: 2.9
      initial_exposure_time: 8
