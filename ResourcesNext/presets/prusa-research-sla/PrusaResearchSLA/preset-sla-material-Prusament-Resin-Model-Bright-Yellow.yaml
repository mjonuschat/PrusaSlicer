id: Prusament Resin Model Bright Yellow
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Prusa Polymers
  material_type: Model
  material_colour: '#C7B91F'
variants:
## SL1S
- condition: printer.model == "SL1S"
  id: 02c5a91b-41ca-4f37-8afd-9fe80f7ffbdb
  unconditional_inherits:
  - '*sl1s_fast*'
  values:
    area_fill: 20
    delay_before_exposure: [1, 10]
    tilt_down_initial_speed: layer1750,layer1750
    tilt_down_offset_steps: [0, 1200]
    tilt_down_finish_speed: move8000,move5120
    tilt_up_initial_speed: move8000,move8000
    tilt_up_offset_steps: [600, 600]
    tilt_up_finish_speed: layer1750,layer1750
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    id: e28b3208-2aec-49f6-9551-53c92981374e
    name: Prusament Resin Model Bright Yellow @SL1S 0.025
    values:
      exposure_time: 2.2
      initial_exposure_time: 5
# 0.05
  - condition: print.layer_height == 0.05
    id: e260c3cf-9c60-4310-a722-81949b83fb39
    name: Prusament Resin Model Bright Yellow @SL1S 0.05
    values:
      exposure_time: 2.4
      initial_exposure_time: 6
# 0.1
  - condition: print.layer_height == 0.1
    id: d6d7e4ca-6a04-4d13-8485-a04428bcfc37
    name: Prusament Resin Model Bright Yellow @SL1S 0.1
    values:
      exposure_time: 2.9
      initial_exposure_time: 8
