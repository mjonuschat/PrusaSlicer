id: Prusament Resin Model Transparent Clear
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Prusa Polymers
  material_type: Model
  material_colour: '#F3F6F4'
variants:
## SL1S
- condition: printer.model == "SL1S"
  id: 72872a67-2ac6-4ff8-b41e-18924e6aa1d4
  unconditional_inherits:
  - '*sl1s_fast*'
  values:
    area_fill: 20
    delay_before_exposure: [1, 10]
    tilt_down_initial_speed: layer1750,layer1750
    tilt_down_offset_steps: [0, 1200]
    tilt_down_finish_speed: move8000,move5120
    tilt_up_initial_speed: move8000,move8000
    tilt_up_offset_steps: [600, 600]
    tilt_up_finish_speed: layer1750,layer1750
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    id: 0d89b6b1-c7c8-4fec-9bb8-5856471e214f
    name: Prusament Resin Model Transparent Clear @SL1S 0.025
    values:
      exposure_time: 2.4
      initial_exposure_time: 5
# 0.05
  - condition: print.layer_height == 0.05
    id: 254a0361-2d70-4577-9ddd-5daeded60959
    name: Prusament Resin Model Transparent Clear @SL1S 0.05
    values:
      exposure_time: 2.8
      initial_exposure_time: 6
# 0.1
  - condition: print.layer_height == 0.1
    id: fb588e19-468a-4337-b7bd-32210e101eb4
    name: Prusament Resin Model Transparent Clear @SL1S 0.1
    values:
      exposure_time: 3.5
      initial_exposure_time: 8
