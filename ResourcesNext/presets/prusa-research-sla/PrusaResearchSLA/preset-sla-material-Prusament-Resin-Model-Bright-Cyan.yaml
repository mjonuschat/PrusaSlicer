id: Prusament Resin Model Bright Cyan
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Prusa Polymers
  material_type: Model
  material_colour: '#0079A7'
variants:
## SL1S
- condition: printer.model == "SL1S"
  id: 854c9a07-d69f-47fc-a4e3-51744146e2f5
  unconditional_inherits:
  - '*sl1s_fast*'
  values:
    area_fill: 20
    delay_before_exposure: [1, 10]
    tilt_down_initial_speed: layer1750,layer1750
    tilt_down_offset_steps: [0, 1200]
    tilt_down_finish_speed: move8000,move5120
    tilt_up_initial_speed: move8000,move8000
    tilt_up_offset_steps: [600, 600]
    tilt_up_finish_speed: layer1750,layer1750
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    id: ac10d3e2-1f38-4369-9425-02cdd94f9e46
    name: Prusament Resin Model Bright Cyan @SL1S 0.025
    values:
      exposure_time: 2.2
      initial_exposure_time: 5
# 0.05
  - condition: print.layer_height == 0.05
    id: 63aa3031-4609-4942-851b-9ed370a0857b
    name: Prusament Resin Model Bright Cyan @SL1S 0.05
    values:
      exposure_time: 2.4
      initial_exposure_time: 6
# 0.1
  - condition: print.layer_height == 0.1
    id: 12d74f4f-8a9a-4f4a-af2a-170c5b7bbe16
    name: Prusament Resin Model Bright Cyan @SL1S 0.1
    values:
      exposure_time: 3.1
      initial_exposure_time: 8
