id: Prusament Resin Model Neutral Beige
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Prusa Polymers
  material_type: Tough
  material_colour: '#BF9C87'
variants:
## SL1
- condition: printer.model == "SL1"
  id: e3bb85db-589c-4a66-8213-aca03558ea24
  unconditional_inherits:
  - '*sl1_fast*'
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    id: 5273d67d-c690-44b3-8c30-94c981d2feb2
    name: Prusament Resin Model Neutral Beige @SL1 0.025
    values:
      exposure_time: 4.8
      initial_exposure_time: 35
# 0.05
  - condition: print.layer_height == 0.05
    id: 3ea3fb7a-534f-4a9c-8b6f-44415d885020
    name: Prusament Resin Model Neutral Beige @SL1 0.05
    values:
      exposure_time: 5.5
      initial_exposure_time: 35
# 0.1
  - condition: print.layer_height == 0.1
    id: e287e4ec-759f-425b-a42c-3dd8180d0844
    name: Prusament Resin Model Neutral Beige @SL1 0.1
    values:
      exposure_time: 7
      initial_exposure_time: 45
## SL1S
- condition: printer.model == "SL1S"
  id: a2bf19ed-e465-43db-9ab7-9cb57b97fc02
  unconditional_inherits:
  - '*sl1s_fast*'
  values:
    area_fill: 20
    delay_before_exposure: [1, 10]
    tilt_down_initial_speed: [layer1750,layer1750]
    tilt_down_offset_steps: [0, 1200]
    tilt_down_finish_speed: [move8000,move5120]
    tilt_up_initial_speed: [move8000,move8000]
    tilt_up_offset_steps: [600, 600]
    tilt_up_finish_speed: [layer1750,layer1750]
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    id: 6c745dea-03d1-4560-a5de-ba7b0e815e2d
    name: Prusament Resin Model Neutral Beige @SL1S 0.025
    values:
      exposure_time: 2.2
      initial_exposure_time: 5
# 0.05
  - condition: print.layer_height == 0.05
    id: bf0e99de-ca26-4b71-ac44-4dc029bbead4
    name: Prusament Resin Model Neutral Beige @SL1S 0.05
    values:
      exposure_time: 2.4
      initial_exposure_time: 6
# 0.1
  - condition: print.layer_height == 0.1
    id: 7d3ac6f5-9990-4c99-a5d9-823ad564b76d
    name: Prusament Resin Model Neutral Beige @SL1S 0.1
    values:
      exposure_time: 3.1
      initial_exposure_time: 8
