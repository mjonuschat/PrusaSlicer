name: Build flatpak asan

on:
  push:
    branches:
      - master
      - release
  workflow_dispatch:

jobs:
  build_flatpak_asan:
    uses: Prusa-Development/PrusaSlicer-Actions/.github/workflows/build_flatpak.yml@slic3r3_prototype
    secrets: inherit
    with:
      with_asan: false
      enable_sentry:  true
      release_build: ${{ startsWith(github.ref, 'refs/tags/version_') }}
      actions_branch: slic3r3_prototype
