name: Build windows

on:
  push:
    branches-ignore:
      - master
      - release
  workflow_dispatch:
    inputs:
      create_pdb:
        description: 'Zip pdbs'
        default: false
        type: boolean
      create_installer:
        description: 'Create installer'
        default: false
        type: boolean
      enable_sentry:
        description: 'Enable sentry'
        default: false
        type: boolean
      release_build:
        description: 'Release build'
        default: false
        type: boolean


jobs:
  build_win:
    uses: Prusa-Development/PrusaSlicer-Actions/.github/workflows/build_windows.yml@slic3r3_prototype
    secrets: inherit
    with:
      actions_branch: slic3r3_prototype
      create_pdb: ${{ inputs.create_pdb || false }}
      create_installer: ${{ inputs.create_installer || false }}
      enable_sentry: ${{ inputs.enable_sentry || false }}
      release_build: ${{ inputs.release_build || startsWith(github.ref, 'refs/tags/version_') }}
