name: Build windows sentry

on:
  push:
    branches:
      - master
      - release
  workflow_dispatch:

jobs:
  build_windows_sentry:
    uses: Prusa-Development/PrusaSlicer-Actions/.github/workflows/build_windows.yml@lm_step_actions
    secrets: inherit
    with:
      enable_sentry:  true
      release_build: ${{ startsWith(github.ref, 'refs/tags/version_') }}
      actions_branch: lm_step_actions
      create_pdb: false
      create_installer: false
