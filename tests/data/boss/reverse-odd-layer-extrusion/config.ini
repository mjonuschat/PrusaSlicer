# BOSS reverse-odd-layer-extrusion fixture config.
#
# The reversal keys are booleans: turn one on at a time to see its effect on
# the matching extrusion kind. layer_height and perimeters are set so a small
# object slices to at least two layers with both an internal and an external
# perimeter, and fill_density is set so infill is present when needed.
internal_perimeters_reverse = 0
overhangs_reverse = 0
infill_reverse = 0
perimeters = 2
fill_density = 20%
overhangs = 1
skirts = 0
support_material = 0
